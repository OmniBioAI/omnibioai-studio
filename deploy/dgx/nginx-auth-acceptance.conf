server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /_health {
        default_type application/json;
        return 200 '{"status":"ok","service":"omnibioai-studio-auth-acceptance"}';
    }

    # The isolated acceptance network provides this explicit alias. Keep all
    # identity, OTP, MFA and license decisions in Auth; nginx only transports.
    location ~ ^/(auth|users|license|me)(/|$) {
        proxy_pass http://auth-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw-client-reload.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
