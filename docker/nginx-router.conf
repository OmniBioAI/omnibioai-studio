##
## OmniBioAI nginx-router.conf — v2
## Changes from v1:
##   - Uses nginxinc/nginx-unprivileged or nginx:alpine (sub_filter built in on mainline)
##   - Prometheus theme injection via sub_filter on /_svc/prometheus route
##   - Static OmniBioAI theme assets at /_omni-static/
##   - Grafana proxied at /_svc/monitor (unchanged)
##
## Bare (non-/_svc/*) paths already claimed at the nginx root:
##   /static/, /admin/, /api/, /health, /health/, /home/, /ws/  -> workbench
##   /auth/, /license/, /roles, /users/                          -> auth-service
##
## These exist because each backend's own templates/redirects/JS reference
## paths bare, with no idea they're actually reachable via a /_svc/<name>
## prefix (nginx strips that prefix before proxying, so from the backend's
## point of view every request just looks like a normal same-origin one).
## Any bare path NOT in the list above falls through to the catch-all
## `location /` (web-ui), which returns index.html with a 200 instead of a
## real 404 -- silently masquerading as "blank page" / "JSON parse error"
## bugs in the frontend instead of an obvious routing error. Already found
## and fixed this way four times (license, roles, users, then six workbench
## paths in one pass).
##
## Adding a new service? Check this list before assuming a bare path is
## free, and grep the other 5 frontends' source + all backends' route
## definitions for it first -- see the workbench collision audit
## (~/nginx-workbench-collision-audit.md) for the methodology, or run
## `scripts/check_route_drift.py` (see its own header) to automate it.
##
## KNOWN DRIFT -- NOT YET FIXED (found by check_route_drift.py, filed as
## tracked issues rather than listed in full here to avoid this comment
## drifting out of sync with them):
## (#5 workbench -- /dashboard/, /ops/, /plugins/ fixed, see locations
##  below. /accounts/ deliberately left unrouted -- collides with LIMS's
##  own bare accounts/login/, accounts/logout/; needs a maintainer call,
##  see the comment above those location blocks. Issue kept open for that.)
## (#11 web-ui Jobs.jsx absolute URL -- fixed, see /_tes location below.)
## (#6 control-center -- fixed, see /summary and /docker/ locations below.
##  Turned out most of the originally-flagged paths (/cloud, /llms,
##  /config, /config/service, cc-ui's own /report/data) belong to cc-ui
##  (frontend/cc-ui), which this docker-compose deployment never actually
##  serves -- target: backend only builds the FastAPI stage, cc-ui/dist is
##  bind-mounted in but nothing serves it (grep for StaticFiles/.mount()
##  in the backend source: zero hits), and main.py's root() serves a
##  completely different, self-contained "OmniBioAI Ecosystem" report page
##  instead. Deliberately NOT routing cc-ui's bare paths -- they're dead
##  code with zero effect either way, and routing them would misleadingly
##  imply cc-ui works. Only routed what that *actually-served* page's own
##  inline JS calls bare: /summary (public) and /docker/* (gated) -- its
##  /auth/login + /auth/validate were already covered by the existing bare
##  /auth/ route, and its /report/generate + /report/status already
##  resolve under /_svc/control via a prefix-aware apiPath() helper.)
## (#7 tool-images API -- fixed, see /v1/tools and /v1/build locations above)
## (#8 model-registry API -- fixed, see /modelregistry/v1, /v1/hf,
##  /v1/promote, /v1/register, /v1/resolve, /v1/verify locations above)
## (#9 dev-hub's /rag/* + /status -- fixed, see the /rag/ and /status
##  locations above)
##
## Also noted, not filed as its own issue (minor, non-blocking): the
## auth_limit rate-limit zone below is only applied to /_svc/auth, /auth/,
## and /license/ -- not to /roles or /users/. Worth deciding whether
## that's intentional or an oversight next time this file is touched.
##

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# X-Forwarded-Proto pass-through -- 2026-07-27 fix for LIMS redirect-loop known-issue.
# Port 80 is loopback-only (127.0.0.1) as of tonight, so this router is only ever
# reached by cloudflared (localhost) -- trusted. Preserve whatever XFP it set; only
# fall back to $scheme (always "http" here, since this nginx never terminates TLS)
# if the header is absent. Scoped to /_svc/lims for now -- see known-issue for
# extending this pattern to other locations.
map $http_x_forwarded_proto $router_xfp {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Control Center's non-public routes are gated on a JWT via /internal/auth/verify
# (see the auth_request block below), which forwards $http_authorization to
# api-gateway's AuthMiddleware (omnibioai-api-gateway/app/middleware/auth.py --
# it only ever reads the Authorization header, nothing else). That works for
# normal fetch()/XHR calls, which set the header explicitly, but Control
# Center is loaded in an <iframe src="/_svc/control">, and there is no way
# for an iframe navigation to carry a custom header -- it can only send
# whatever the browser attaches automatically, i.e. cookies. So: use the
# Authorization header when a caller sends one, and only when it's absent,
# synthesize one from the omnibioai_access_token cookie that session.js /
# lib/web/session.js keep mirrored from the same JWT they hold in
# localStorage. gateway still only ever sees a standard Authorization
# header either way -- no gateway-side change needed.
map $cookie_omnibioai_access_token $control_cookie_authorization {
    default   "Bearer $cookie_omnibioai_access_token";
    # Empty (no cookie) must stay a truly empty header value, not "Bearer "
    # -- gateway's AuthMiddleware does `.removeprefix("Bearer ").strip()`,
    # and a bare "Bearer" with no token after it survives that unchanged
    # (a trailing-space-only header value gets trimmed by HTTP parsing
    # before the middleware ever sees it), so it reads as a truthy garbage
    # token instead of "no token" -- still a 401 either way, just the wrong
    # audit reason (invalid_token instead of missing_token).
    ''        "";
}
map $http_authorization $control_authorization {
    default   $http_authorization;
    ''        $control_cookie_authorization;
}

upstream workbench     { server workbench:8000; }
upstream lims          { server lims:7000; }
upstream rag           { server rag:8096; }
upstream gateway       { server api-gateway:8080; }
upstream auth          { server auth-service:8001; }
upstream policy        { server policy-engine:8002; }
upstream hpc           { server hpc-policy-engine:8003; }
upstream audit         { server security-audit:8004; }
upstream control       { server control-center:7070; }
upstream grafana       { server grafana:3000; }
upstream videos        { server videos:8086; }
upstream launcher      { server launcher:5190; }
upstream modelregistry    { server model-registry:8095; }
upstream modelregistry-ui { server model-registry:5176; }
upstream workflows     { server workflow-bundles:8098; }
upstream workflows-ui  { server workflow-bundles:5178; }
upstream toolimages    { server tool-images:8097; }
upstream toolimages-ui { server tool-images:5179; }
upstream devhub        { server dev-hub:8082; }
upstream devhub-ui     { server dev-hub:5173; }
upstream tes-ui        { server tes:5177; }
upstream tes-api       { server tes:8081; }
upstream opa           { server opa:8181; }
upstream toolserver    { server toolserver:9090; }
upstream prometheus    { server prometheus:9090; }
upstream jupyter       { server jupyter:8888; }
upstream rstudio       { server rstudio:8787; }
upstream vscode        { server vscode:8080; }
upstream web-ui        { server web-ui:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10G;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout  10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── Health check ──────────────────────────────────────────────────────────
    location = /_health {
        return 200 '{"status":"ok","router":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── OmniBioAI static theme assets ─────────────────────────────────────────
    # Volume mount required in docker-compose nginx-router service:
    #   - ./docker/static:/etc/nginx/omni-static:ro
    location ^~ /_omni-static/ {
        alias /etc/nginx/omni-static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        default_type text/css;
    }

    # ── Prometheus — OmniBioAI theme injection ────────────────────────────────
    # sub_filter rewrites HTML responses to inject the theme CSS.
    # IMPORTANT: proxy_set_header Accept-Encoding "" prevents gzip so
    # nginx can read and rewrite the HTML body.
    # NOTE: this requires nginx built with ngx_http_sub_module.
    # Use image: nginx:latest (not alpine) in docker-compose — it includes sub_filter.
    location = /_svc/prometheus {
        return 301 /_svc/prometheus/graph;
    }
    location ^~ /_svc/prometheus/ {
        rewrite ^/_svc/prometheus(/.*)$ $1 break;
        proxy_pass http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        sub_filter_once  on;
        sub_filter '</head>' '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/_omni-static/prometheus-theme.css"></head>';
    }

    # ── Service routes ────────────────────────────────────────────────────────
    location ^~ /_svc/gateway     { rewrite ^/_svc/gateway(/.*)$     $1 break; proxy_pass http://gateway; }
    location ^~ /docs/ {
        alias /docs/;
        index getting-started.html index.html;
        autoindex on;
        default_type text/plain;
    }
    location ^~ /_svc/workbench   { rewrite ^/_svc/workbench(/.*)$   $1 break; proxy_pass http://workbench; }
    location ^~ /_svc/lims {
        # NOTE: this location defines its own proxy_set_header directives, which means
        # none of the server-level ones above are inherited (nginx behavior: a location
        # with any proxy_set_header of its own inherits none from the parent) -- so every
        # header the server block normally sets must be re-declared here explicitly.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $router_xfp;
        rewrite ^/_svc/lims(/.*)$ $1 break;
        proxy_pass http://lims;
    }
    # LIMS's session login (django.contrib.auth's LoginView/LogoutView,
    # lab_data_manager/urls.py). Bare, not under /_svc/lims -- LIMS has no
    # FORCE_SCRIPT_NAME/prefix-awareness either (see /accounts/ above), so
    # it always emits bare /lims-accounts/... links. Moved off bare
    # /accounts/ to resolve issue #5's collision with workbench's allauth.
    location ^~ /lims-accounts/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $router_xfp;
        proxy_pass http://lims;
    }
    location = /_svc/rag {
        return 301 /_svc/rag/;
    }
    location ^~ /_svc/rag/ {
        proxy_pass http://rag/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter 'src="./assets/' 'src="/_svc/rag/assets/';
        sub_filter 'href="./assets/' 'href="/_svc/rag/assets/';
        sub_filter_once off;
        sub_filter_types text/html;
    }
    # model-registry runs two ports: 8095 is the JSON API (upstream
    # `modelregistry`), 5176 is the actual UI, whose built assets are
    # hardcoded to expect this exact /_svc/modelregistry/ prefix (see its
    # index.html <script>/<link> src).
    location ^~ /_svc/modelregistry { rewrite ^/_svc/modelregistry(/.*)$ $1 break; proxy_pass http://modelregistry-ui; }
    # model-registry-ui's own source is internally inconsistent about its
    # base path (two different bare-path families, confirmed live, both
    # actually used):
    #   - api/registry.ts: BASE_URL = "/modelregistry/v1" — models,
    #     aliases, metrics, compare, tags, stage, runs/list, runs/get,
    #     artifacts. Its own vite.config.ts dev-proxy rewrites this by
    #     stripping "/modelregistry" before reaching the backend's real
    #     bare /v1/* routes (DEFAULT_PREFIX = "/v1" in
    #     service/app/main.py) — same shape as /_svc/workflows/v1 below,
    #     hence the rewrite here too.
    #   - HFPushButton.tsx (BASE_URL = "/v1/hf"), VersionRow.tsx and
    #     ModelDrawer.tsx (bare "/v1/promote"), RegisterModelModal.tsx
    #     (BASE_URL = "/v1", "/v1/register"), ModelDrawer.tsx again
    #     ("/v1/resolve", "/v1/verify") — these already match the
    #     backend's real route shape exactly, no rewrite needed.
    # Exact matches on the single leaf endpoints (promote/register/
    # resolve/verify have no sub-paths) rather than a blanket /v1/ prefix,
    # which would also swallow tool-images' already-routed /v1/tools and
    # /v1/build (#7) above. /v1/register is a documented latent naming
    # collision with workflow-bundles' OWN /v1/register
    # (omnibioai-workflow-bundles/api/server.py) — not a live collision,
    # since workflow-ui's own frontend always calls it via
    # /_svc/workflows/v1/register (Vite BASE_URL-aware), never bare, but
    # worth keeping in mind if that ever changes.
    # No auth-gating split needed here (unlike control-center, #6) — auth
    # is enforced entirely at the application level via
    # Depends(require_write_auth) on register/promote/hf-push (reads the
    # Authorization header directly, same JWT/secret as everywhere else),
    # not via nginx auth_request; resolve/verify/hf-settings need no auth
    # at all. No WebSocket or streaming (SSE) endpoints here either.
    location ^~ /modelregistry/v1 {
        rewrite ^/modelregistry(/.*)$ $1 break;
        proxy_pass http://modelregistry;
    }
    location ^~ /v1/hf      { proxy_pass http://modelregistry; }
    location = /v1/promote  { proxy_pass http://modelregistry; }
    location = /v1/register { proxy_pass http://modelregistry; }
    location = /v1/resolve  { proxy_pass http://modelregistry; }
    location = /v1/verify   { proxy_pass http://modelregistry; }
    location ^~ /_svc/workflows/v1      { rewrite ^/_svc/workflows(/.*)$ $1 break; proxy_pass http://workflows; }
    location ^~ /_svc/workflows/assets/ { proxy_pass http://workflows-ui; }
    location ^~ /_svc/workflows         { proxy_pass http://workflows-ui; }
    # Same split as model-registry above: tool-images' UI is on 5179, its
    # JSON API (upstream `toolimages`) is on 8097.
    location ^~ /_svc/toolimages  { rewrite ^/_svc/toolimages(/.*)$  $1 break; proxy_pass http://toolimages-ui; }
    # tool-images-ui's own source (src/api.ts: `const BASE = ''`) calls
    # these bare, root-relative — confirmed live, matching
    # api/server.py's exact route set (no other /v1/* routes exist there).
    # No auth dependency on any of these routes (unlike control-center),
    # no WebSocket (unlike workbench) — a straightforward uniform case.
    # /v1/build/{tool} and /v1/build-all use EventSourceResponse (SSE
    # streaming, same as dev-hub's /rag/stream), hence proxy_buffering off.
    # Collision-audited against the other 4 frontends' source and every
    # other backend's route definitions — zero hits.
    location ^~ /v1/tools { proxy_pass http://toolimages; }
    location ^~ /v1/build {
        proxy_pass http://toolimages;
        proxy_buffering off;
    }
    # dev-hub's UI is on 5173, its JSON API (upstream `devhub`) is on 8082.
    location ^~ /_svc/devhub      { rewrite ^/_svc/devhub(/.*)$      $1 break; proxy_pass http://devhub-ui; }
    # dev-hub-ui's own source (src/api/client.ts: `const API_BASE = ""`)
    # calls these bare, root-relative, ignoring its own /_svc/devhub Vite
    # base entirely — confirmed live in source, not just inferred from its
    # vite.config.ts dev-proxy table (which also has stale /api and /health
    # entries the frontend doesn't actually call — deliberately not routed
    # here; see issue #9). Collision-audited against the other 4 frontends'
    # source, the real `rag` service's own frontend, and every backend's
    # route definitions — the only near-hit was auth-service's
    # /license/status, which is prefixed and already routed separately, not
    # a real collision. No WebSocket routes anywhere in dev-hub.
    #   - /rag/query, /rag/stream : api/routes/rag.py, prefix="/rag" —
    #     /stream is a FastAPI StreamingResponse (proxy_buffering off below),
    #     not a websocket; client.ts's ragStream() reads it via a plain
    #     fetch() body reader.
    #   - /status : api/main.py, bare app.get("/status") — called from both
    #     client.ts's getStatus() and KnowledgeGraph.tsx directly.
    location ^~ /rag/ {
        proxy_pass http://devhub;
        proxy_buffering off;
    }
    location = /status { proxy_pass http://devhub; }
    location ^~ /_svc/tes         { rewrite ^/_svc/tes(/.*)$         $1 break; proxy_pass http://tes-ui; }
    # TES's own dashboard UI is on 5177 (above); its JSON API (upstream
    # `tes-api`) is on 8081 -- web-ui's Jobs.jsx fetches this bare via /_tes
    # (issue #11), matching the vite dev-proxy table's /_tes entry.
    location ^~ /_tes             { rewrite ^/_tes(/.*)$             $1 break; proxy_pass http://tes-api; }
    location ^~ /_svc/sdk         { rewrite ^/_svc/sdk(/.*)$         $1 break; proxy_pass http://launcher; }
    location ^~ /_svc/videos      { rewrite ^/_svc/videos(/.*)$      $1 break; proxy_pass http://videos; }
    # /_svc/control with no trailing slash 404s: the rewrite below requires
    # a "/" after "control" to fire, so the unmodified URI gets forwarded
    # as-is to FastAPI, which has no route matching literal "/_svc/control"
    # (its real root route is "/"). Same trailing-slash class of bug as
    # /_svc/rag below. Workbench.jsx's Control Center tile now passes the
    # trailing-slash form directly; this redirect is the safety net for
    # anything else (bookmarks, manual URLs) hitting the bare form.
    location = /_svc/control {
        return 301 /_svc/control/;
    }
    # Control center — public read-only endpoints (no JWT required)
    # These are needed by the ecosystem report health tab and generate_report.py
    location ~* ^/_svc/control/(health|summary|services|report|report/data)$ {
        rewrite ^/_svc/control(/.*)$ $1 break;
        proxy_pass http://control;
    }

    # Control center — all other endpoints require JWT
    location /_svc/control {
        auth_request      /internal/auth/verify;
        auth_request_set  $auth_status $upstream_status;
        error_page 401 = @cc_unauthorized;
        rewrite ^/_svc/control(/.*)$ $1 break;
        proxy_pass http://control;
    }
    # control-center's own served page (main.py's root(), NOT cc-ui — see
    # the KNOWN DRIFT note at the top of this file for why cc-ui's own
    # bare paths aren't routed at all) calls these bare, unprefixed, unlike its
    # report/generate + report/status calls (which go through a
    # window.location.pathname-aware apiPath() helper and already resolve
    # under /_svc/control, hitting the gated block above) or its
    # auth/login + auth/validate calls (already covered by the existing
    # bare /auth/ route below, same backend, same semantics). Rather than
    # duplicating the auth_request/public-regex split above, these
    # internally rewrite to their already-covered /_svc/control/*
    # equivalents and let nginx re-match from scratch (the `last` flag) --
    # one policy, not two copies that could drift apart.
    #   - /summary is in the public allowlist above -> stays public here.
    #   - /docker/* is deliberately NOT in that allowlist (live container/
    #     image info) -> stays behind the JWT gate here too.
    location = /summary {
        rewrite ^/summary$ /_svc/control/summary last;
    }
    location ^~ /docker/ {
        rewrite ^/docker/(.*)$ /_svc/control/docker/$1 last;
    }
    location ^~ /_svc/monitor {
        rewrite ^/_svc/monitor(/.*)$ $1 break;
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / "/; SameSite=Lax";
    }
    location ^~ /_svc/toolserver  { rewrite ^/_svc/toolserver(/.*)$  $1 break; proxy_pass http://toolserver; }
    location ^~ /_svc/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        rewrite ^/_svc/auth(/.*)$ $1 break;
        proxy_pass http://auth;
    }
    # Bare /auth/* — OAuth2 login/callback redirect targets registered with
    # Google/GitHub/Microsoft are https://webstudio.omnibioai.org/auth/{provider}/callback,
    # i.e. this domain's root, not /_svc/auth. auth-service's own routes
    # already live under /auth/*, so this is a straight passthrough with no
    # rewrite (unlike /_svc/auth above, which strips its prefix).
    # Kept alongside /_svc/auth rather than replacing it — other things may
    # depend on that route.
    location ^~ /auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth;
    }
    # License key validation endpoint
    location ^~ /license/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Role-management endpoints (omnibioai-auth/app/api/routes_roles.py) —
    # that router has no prefix, so its routes really are bare /roles and
    # /users/{id}/roles, same as /auth/* and /license/* above. Missing this
    # location was why rolesApi.js's fetch("/roles") fell through to the
    # catch-all `location /` (web-ui) instead, which returns index.html
    # with a 200 — RoleManagement.jsx's fetch then failed to parse HTML as
    # JSON. auth-service's own require_permission(MANAGE_ROLES) dependency
    # already gates these from the Authorization header rolesApi.js sends
    # (a normal fetch() call, not an iframe, so no cookie-fallback trick
    # like /_svc/control needed here).
    location ^~ /roles {
        proxy_pass http://auth;
    }
    location ^~ /users/ {
        proxy_pass http://auth;
    }
    # Workbench (${MACHINE_DIR}/omnibioai, Django) — same bare-route pattern
    # as /roles and /users/ above. nginx strips /_svc/workbench before
    # proxying, so from Django's own point of view every request just looks
    # like a normal same-origin request — including its own redirects and
    # <link>/<script> tags, which it emits bare (e.g. STATIC_URL = "/static/"
    # in omnibioai/settings.py) because it has no idea it's reachable at a
    # /_svc/workbench prefix at all. Collision-audited against all 5
    # frontends' source and every other backend's route definitions this
    # session — nothing else claims any of these bare paths. See
    # omnibioai/urls.py / omnibioai/asgi.py for the source routes:
    #   - /static/ : STATIC_URL (omnibioai/settings.py) — confirmed live,
    #     every /_svc/workbench/* page's HTML references it bare.
    #   - /admin/  : path("admin/", admin.site.urls) — confirmed live, its
    #     login-required redirect currently 302s to a bare, unroutable
    #     /admin/login/?next=/admin/.
    #   - /api/    : specific leaf routes only (api/auth/me/, api/run/,
    #     api/dev/objects/...), not a blanket prefix — unmatched sub-paths
    #     will 404 from Django, which is fine (a real 404 beats the SPA
    #     shell's silent 200).
    #   - /health  : plugins/home/urls.py, both with and without trailing
    #     slash — "Workbench health endpoint (for Control Center probes)"
    #     per its own comment. Distinct from this router's own /_health.
    #   - /home/   : plugins/home/urls.py, explicit intentional alias
    #     ("Optional: keep an explicit /home/ alias for the main dashboard").
    location ^~ /static/ { proxy_pass http://workbench; }
    location ^~ /admin/  { proxy_pass http://workbench; }
    # allauth (google/github/microsoft + password) — path("accounts/",
    # include("allauth.urls")). Bare, same reason as /static/ and /admin/
    # above: Django has no FORCE_SCRIPT_NAME/prefix-awareness, so it always
    # emits bare /accounts/... links regardless of any proxy prefix. Issue
    # #5: LIMS's own login used to collide here too -- LIMS moved to
    # /lims-accounts/ instead (see below) since only one service can own
    # this bare path.
    location ^~ /accounts/ { proxy_pass http://workbench; }
    # Intentionally a full /api/ prefix match, not limited to the specific
    # known leaf routes (api/auth/me/, api/run/, api/dev/objects/...) —
    # Django 404s on unmatched sub-paths, which is strictly better than the
    # SPA catch-all's silent 200. Do not narrow this to explicit leaf
    # routes without re-checking that assumption still holds.
    location ^~ /api/    { proxy_pass http://workbench; }
    # Exact matches only — the real Django routes are literally just
    # /health and /health/ (plugins/home/urls.py), nothing else starting
    # with /health/. A ^~ prefix match here would also swallow an unrelated
    # future path like /health-dashboard.
    location = /health   { proxy_pass http://workbench; }
    location = /health/  { proxy_pass http://workbench; }
    location ^~ /home/   { proxy_pass http://workbench; }
    # Django Channels websocket routes (omnibioai/asgi.py +
    # plugins/collaboration/routing.py) — /ws/workflow/progress/{id}/ and
    # /ws/collaboration/{workspace_id}/. Unlike the plain HTTP routes above,
    # these need the Upgrade/Connection handshake headers (same treatment
    # as /jupyter/ and /vscode/ below) or the WebSocket handshake fails.
    location ^~ /ws/ {
        proxy_pass http://workbench;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Issue #5 (workbench's remaining bare paths), collision-audited against
    # all sibling repos' frontends and backends:
    #   - /dashboard/ : omnibioai/urls.py path("dashboard/", ...) — live.
    #   - /ops/       : omnibioai/urls.py + plugins/home/urls.py — live.
    #   - /plugins/   : omnibioai/urls.py + plugin-registry auto-mounts
    #     (e.g. plugins/catalog/) — live.
    # Confirmed no collision: control-center's own /dashboard handler
    # (combined_control_center.py) is dead code, never imported/served.
    #
    # /accounts/ -- RESOLVED (was flagged here as a maintainer decision,
    # now made as part of the SSO plan's Milestone 0): workbench keeps bare
    # /accounts/ (routed above, next to /static/ and /admin/); LIMS's own
    # urls.py/settings.py moved its login off bare /accounts/ onto
    # /lims-accounts/ instead (routed near /_svc/lims above) since only one
    # service can own a bare path neither app is prefix-aware enough to
    # share.
    #
    # NOT routed, on purpose:
    #   - /media, /pipeline-dashboard, /tools : vite-config leftovers in
    #     omnibioai-studio's dev-proxy table with no live Django handler at
    #     those exact bare paths (no MEDIA_URL is even configured; the real
    #     pipeline-dashboard plugin mounts at /plugins/pipeline_dashboard/,
    #     already covered by /plugins/ above; no bare /tools route exists,
    #     only /plugins/catalog/api/tools/). Routing them would misleadingly
    #     imply working features that don't exist server-side.
    #   - /report : vite-config leftover from before the #6 fix — confirmed
    #     control-center's actually-served page only calls /report/generate
    #     and /report/status through the /_svc/control-prefixed apiPath()
    #     helper, never bare. Matches #6's own closing notes.
    location ^~ /dashboard/ { proxy_pass http://workbench; }
    location ^~ /ops/       { proxy_pass http://workbench; }
    location ^~ /plugins/   { proxy_pass http://workbench; }
    location ^~ /_svc/policy {
        rewrite ^/_svc/policy/?(.*)$ /$1 break;
        proxy_pass http://policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location ^~ /_svc/hpc {
        rewrite ^/_svc/hpc/?(.*)$ /$1 break;
        proxy_pass http://hpc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location ^~ /_svc/audit  { rewrite ^/_svc/audit(/.*)$  $1 break; proxy_pass http://audit; }
    location ^~ /_svc/opa    { rewrite ^/_svc/opa(/.*)$    $1 break; proxy_pass http://opa; }

    # ── IDE services ──────────────────────────────────────────────────────────
    location /jupyter/ {
        proxy_pass http://jupyter/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /rstudio/ { proxy_pass http://rstudio/; }
    location /vscode/ {
        proxy_pass http://vscode/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / { proxy_pass http://web-ui; }

    # Internal subrequest — strips body, forwards Authorization header only
    # (falling back to the access-token cookie via $control_authorization —
    # see the map{} above — for iframe navigations, which can't send it).
    location = /internal/auth/verify {
        internal;
        proxy_pass              http://gateway/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Authorization $control_authorization;
    }

    location @cc_unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"Valid JWT required to access Control Center"}';
    }
}
