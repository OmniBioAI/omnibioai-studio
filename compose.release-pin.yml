# Local public-portal release. Apply after the existing Studio Compose files.
# Paths resolve relative to the first Compose file (omnibioai-studio/docker-compose.yml).
services:
  videos:
    image: omnibioai-videos:2c8b0e7
    platform: linux/arm64
    pull_policy: never
    build: !reset null
    volumes: !override
      - type: bind
        source: ../omnibioai-videos/content
        target: /content
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../omnibioai-videos/dist/release-2c8b0e7/nginx.public.8086.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
