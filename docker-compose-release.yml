# OmniBioAI Studio - Release configuration
# Uses pre-built images from ghcr.io
# Version: v0.7.0
#
# NOTE: this file is not the one electron-builder/electron actually bundle
# into packaged installers -- that's docker-compose.release.yml (dot). This
# dash-named file is kept in credential/exposure parity with it (see
# tests/test_compose_release_config.py) for anyone still invoking it
# directly/via the disabled release workflow, but it is not the live
# shipped artifact -- see SECURITY-COMPOSE-HARDENING.md.
#
# Setup:
#   cp .env.example .env
#   # Edit .env with your paths and secrets -- MYSQL_ROOT_PASSWORD, AUTH_SECRET_KEY,
#   # LICENSE_SECRET, GF_ADMIN_PASSWORD, LIMSX_DJANGO_SECRET_KEY, JUPYTER_TOKEN,
#   # RSTUDIO_PASSWORD, and VSCODE_PASSWORD are REQUIRED -- compose refuses to
#   # start without them.
#   docker compose -f docker-compose.release.yml up -d
#
# This is the production/default configuration: mysql and redis are NOT
# published to the host. For local development access to them, layer the
# explicit dev overlay:
#   docker compose -f docker-compose.release.yml -f docker-compose.release.dev-ports.yml up -d

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  # Security boundary (see SECURITY-COMPOSE-HARDENING.md): mysql/redis are
  # intentionally NOT published to the host in this release/default
  # configuration -- every consumer already reaches them over the internal
  # Docker network by service name (mysql:3306, redis:6379).
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set -- see DEPLOYMENT.md. Refusing to start with a silently-guessable default}
      MYSQL_DATABASE: ${MYSQL_DEFAULT_DB:-omnibioai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ${DB_INIT_DIR}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    command: ["run", "--server"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Security Control Plane
  # ---------------------------------------------------------------------------

  auth-service:
    image: ghcr.io/omnibioai/omnibioai-auth:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,https://webstudio.omnibioai.org,https://app.omnibioai.org,https://lims.omnibioai.org,https://omnibioai.org}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-https://webstudio.omnibioai.org}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://webstudio.omnibioai.org}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  policy-engine:
    image: ghcr.io/omnibioai/omnibioai-policy-engine:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8002:8002"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  hpc-policy-engine:
    image: ghcr.io/omnibioai/omnibioai-hpc-policy-engine:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8003:8003"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      DB_NAME: ${MYSQL_DEFAULT_DB:-omnibioai}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  security-audit:
    image: ghcr.io/omnibioai/omnibioai-security-audit:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8004:8004"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      # SSO Phase 2 PR2 (JWT consumer audit): same shared secret
      # auth-service signs with and api-gateway/control-center already
      # verify with (all AUTH_SECRET_KEY) -- previously unset here, so
      # api/deps.py::require_platform_admin and
      # audit/identity.py::validate_identity_token both fell back to the
      # public literal "change-me" instead of the real secret.
      JWT_SECRET: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  # Phase I: ghcr.io/omnibioai/omnibioai-security-audit-worker is now
  # published by CI (security-audit PR #7). Image-only, no build: (matches
  # every other service in this file); env vars and depends_on mirror
  # docker-compose.yml's security-audit-worker exactly (same
  # AuditConfig.EVENT_SIGNING_SECRET/DATABASE_URL consumers -- see
  # worker/main.py and db/session.py in that repo), just with this file's
  # required (:?) secret guards instead of dev's silently-defaulting ones.
  # Note: unlike the security-audit (API) entry directly above, this
  # worker entry includes AUDIT_DATABASE_URL and a mysql depends_on --
  # the worker is the process that actually writes audit_events rows
  # (Sink.write() in consumers/sink.py), so it needs the DB connection
  # regardless of whether the API entry in this particular file currently
  # has it (a pre-existing gap between this file and docker-compose.
  # release.yml's fuller security-audit block, not introduced or fixed
  # here -- out of scope for this change). No ports: -- Dockerfile.worker
  # doesn't EXPOSE anything, it's a Redis Streams consumer loop, not an
  # HTTP service.
  security-audit-worker:
    image: ghcr.io/omnibioai/omnibioai-security-audit-worker:latest
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      AUDIT_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}@mysql:3306/omnibioai_audit
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    image: ghcr.io/omnibioai/omnibioai-api-gateway:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      IAM_URL: http://auth-service:8001
      POLICY_URL: http://policy-engine:8002
      HPC_URL: http://hpc-policy-engine:8003
      AUDIT_URL: http://security-audit:8004
      JWT_SECRET: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      TES_URL: http://tes:8081
      WORKBENCH_URL: http://workbench:8000
      TOOLSERVER_URL: http://toolserver:9090
      RAG_URL: http://rag:8096
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      policy-engine:
        condition: service_started
      hpc-policy-engine:
        condition: service_started
      security-audit:
        condition: service_started
      workbench:
        condition: service_started
      tes:
        condition: service_started
      toolserver:
        condition: service_started
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Core Services
  # ---------------------------------------------------------------------------

  toolserver:
    image: ghcr.io/omnibioai/omnibioai-toolserver:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:9090:9090"
    environment:
      PYTHONUNBUFFERED: "1"
      IAM_URL: http://auth-service:8001
      AUDIT_URL: http://security-audit:8004
    volumes:
      - ${WORKSPACE_HOST}:/workspace
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  tes:
    image: ghcr.io/omnibioai/omnibioai-tes:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8081:8081"
      - "${HOST_IP:-0.0.0.0}:5177:5177"
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/bin/docker
      # #54: talk to the docker-socket-proxy's exposed socket, not the
      # raw host one -- the volumes: block below no longer mounts
      # /var/run/docker.sock directly. See that service's own
      # PROXY_ALLOWED_BIND_PREFIXES comment for TES's real bind-mount
      # set in this deployment shape (no OMNIBIOAI_EXTRA_MOUNTS is set
      # here, unlike docker-compose.yml's dev tes block, so the
      # singularity/squashfs mounts that env var drives never apply).
      DOCKER_HOST: unix:///var/run/proxy-socket/docker.sock
      TOOLSERVER_BASE_URL: http://toolserver:9090
      TES_TOOLS: /workspace/configs/tools.example.yaml
      TES_SERVERS: /workspace/configs/servers.example.yaml
      TMPDIR: /tmp/omnibioai_tes_runs
      IAM_URL: http://auth-service:8001
      POLICY_URL: http://policy-engine:8002
      HPC_POLICY_URL: http://hpc-policy-engine:8003
      AUDIT_URL: http://security-audit:8004
      REDIS_URL: redis://redis:6379
      SINGULARITY_CACHEDIR: /tmp/singularity_cache
      SINGULARITY_TMPDIR: /tmp/singularity_tmp
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
    volumes:
      - ${WORKSPACE_HOST}:/workspace
      # #54: proxy's exposed socket, not the raw host one -- see
      # DOCKER_HOST in environment: above. :ro because TES only ever
      # needs to *connect to* this socket file, never write to it.
      - docker-proxy-socket:/var/run/proxy-socket:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    command:
      - bash
      - -lc
      - |
        service nginx start && \
        omnibioai-tes serve \
          --host 0.0.0.0 \
          --port 8081 \
          --tools /workspace/configs/tools.example.yaml \
          --servers /workspace/configs/servers.example.yaml
    depends_on:
      docker-socket-proxy:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      toolserver:
        condition: service_started
    restart: on-failure

  # #265: policy-enforcing proxy in front of the real host docker.sock,
  # for workbench specifically (ported from docker-compose.yml's own
  # docker-socket-proxy service -- see that file's comment for the full
  # threat model). Image-only, no build: (matches every other service in
  # this file -- it has no build: precedent at all) -- published by CI
  # from docker-socket-proxy/ the same way omnibioai-web already is (see
  # .github/workflows/build-docker-socket-proxy.yml).
  #
  # #54: extended to tes/celery-worker/control-center below (ported from
  # docker-compose.yml's own #54 extension -- see that file's comment
  # for each service's full, individually-verified traffic pattern) and
  # to workflow_runner's own nested sibling-container dispatch (see
  # PROXY_ALLOWED_NAMED_VOLUMES below). launcher and workflow-bundles are
  # NOT touched here: neither has a docker.sock mount in THIS file at
  # all (grepped and confirmed -- a pre-existing gap in this release
  # config, predating and unrelated to this change, not silently
  # introduced by it); workflow-bundles is additionally excluded on
  # purpose even where it IS wired (docker-compose.yml, dev) -- see that
  # file's own workflow-bundles comment for why.
  docker-socket-proxy:
    image: ghcr.io/omnibioai/docker-socket-proxy:latest
    restart: on-failure
    environment:
      PROXY_LISTEN_SOCKET: /var/run/proxy-socket/docker.sock
      DOCKER_SOCK_PATH: /var/run/docker-real.sock
      # #265: matches docker-compose.yml's own three real bind-mount
      # prefixes (ml_utils.py's run_dir under WORK_DIR, the model
      # registry root under MACHINE_DIR/data, and the ML cache dir) --
      # see that file's comment for how each was confirmed. One
      # pre-existing gap found while porting, NOT fixed here (separate,
      # real, unrelated to this proxy): ml_utils.py's
      # DEFAULT_MODEL_REGISTRY_ROOT is a hardcoded absolute dev-machine
      # path ("/home/manish/Desktop/machine/data/local_registry/
      # model_registry"), not derived from any env var a real end user's
      # install would set differently -- so that specific bind already
      # doesn't work correctly for any non-dev deployment regardless of
      # this proxy, dev or release. Not this proxy's bug to fix; flagged
      # as its own follow-up rather than silently worked around here.
      # This is also celery-worker's own dominant real docker.sock
      # consumer (same ml_utils.run_ml_docker_job(), called from its ~50
      # ML plugins' Celery tasks) -- no separate prefixes needed for it.
      #
      # #54: the remaining entries are TES's own real `workflow_runner`
      # tool's UNCONDITIONAL bind mounts (execution/adapters/local.py in
      # omnibioai-tes -- always added for that tool regardless of
      # config): fixed Slurm/munge/Cromwell paths, plus ${MACHINE_DIR}/
      # omnibioai (repo_root, found by walking up from work_dir looking
      # for an "omnibioai" subdir + a repo marker -- may resolve to
      # nothing on a real end-user install with no such checkout, same
      # already-flagged shape as the DEFAULT_MODEL_REGISTRY_ROOT gap
      # above, harmless to allow either way). Deliberately does NOT
      # include docker-compose.yml's (dev) singularity/squashfs/fuse
      # entries -- this file's own tes block (above) never sets
      # OMNIBIOAI_EXTRA_MOUNTS, so local.py's _extra_mount_args() always
      # returns empty here; adding prefixes for binds that can never be
      # requested in this deployment shape would be exactly the kind of
      # silent over-broadening this change is meant to avoid.
      # control-center needs NO new prefixes (never calls
      # /containers/create -- same as docker-compose.yml's control-center
      # comment; identical image/code, so the same grep evidence applies).
      PROXY_ALLOWED_BIND_PREFIXES: ${WORK_DIR},${MACHINE_DIR}/data,/root/.cache/omnibioai/torch,/etc/passwd,/etc/group,/etc/munge,/run/munge/munge.socket.2,/etc/slurm,/cromwell-executions,${MACHINE_DIR}/omnibioai
      # #54: exact-match named-volume allowlist (see docker-socket-proxy/
      # policy.py's _is_allowed_named_volume) -- lets workflow_runner's
      # spawned sibling container reference THIS proxy's own already-
      # existing, compose-created socket volume by name, the same volume
      # workbench itself already mounts below.
      PROXY_ALLOWED_NAMED_VOLUMES: docker-proxy-socket
    volumes:
      - /var/run/docker.sock:/var/run/docker-real.sock
      - docker-proxy-socket:/var/run/proxy-socket

  workbench:
    image: ghcr.io/omnibioai/omnibioai-app:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8000:8000"
    environment:
      # #265: talk to the docker-socket-proxy's exposed socket, not the
      # raw host one -- the volumes: block below no longer mounts
      # /var/run/docker.sock directly.
      DOCKER_HOST: unix:///var/run/proxy-socket/docker.sock
      DEBUG: "1"
      CSRF_EXTRA_ORIGINS: "http://localhost:5174,http://localhost:8000,http://${HOST_IP:-0.0.0.0}:5174,http://${HOST_IP:-0.0.0.0}:8000"
      DJANGO_SETTINGS_MODULE: omnibioai.settings
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      CELERY_BROKER_URL: redis://redis:6379/1
      TES_BASE_URL: http://tes:8081
      OLLAMA_BASE_URL: http://ollama:11434
      TOOLSERVER_BASE_URL: http://toolserver:9090
      MODEL_REGISTRY_BASE_URL: http://model-registry:8095
      RAG_BASE_URL: http://rag:8096
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OMNIBIOAI_TES_URL: http://tes:8081
      OMNIBIOAI_HOST_APP_PREFIX: ${WORKSPACE_HOST}
      OMNIBIOAI_HOST_WORK_PREFIX: ${WORK_DIR}
      OMNI_OBJECT_STORAGE_DIR: /app/work/objects
      OMNI_OBJECT_REGISTRY_PATH: /app/work/object_registry.json
      OMNIBIOAI_RUNS_ROOT: /app/work/runs
      OMNIBIOAI_MYSQL_HOST: mysql
      OMNIBIOAI_MYSQL_PORT: "3306"
      OMNIBIOAI_MYSQL_USER: root
      OMNIBIOAI_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      OMNIBIOAI_MYSQL_DB: omnibioai
      GATEWAY_URL: http://api-gateway:8080
      RAGBIO_API_KEY: ${RAGBIO_API_KEY:-}
      RAGBIO_HOST: 0.0.0.0
      LIMS_BASE_URL: "http://lims:7000"
      LIMS_USERNAME: ${LIMS_USERNAME:-admin}
      LIMS_PASSWORD: ${LIMS_PASSWORD:-omnibioai}
      LIMS_REFRESH_TOKEN: ${LIMS_REFRESH_TOKEN:-}
      LIMS_API_TOKEN: ""
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
    volumes:
      # #265: ported from docker-compose.yml's own fix (dev-only file,
      # never reached real users) -- see that file's comment for the
      # full grep evidence. NOT a straight copy: docker-compose.yml also
      # mounts ${MACHINE_DIR}/omnibioai-tes/configs (bio_agent/views.py's
      # tools.example.yaml read) alongside data/PubMed, but that path is
      # a sibling-repo-checkout convention specific to this dev machine's
      # own directory layout -- for a real packaged install, MACHINE_DIR
      # resolves to the end user's home directory (see electron/main.js's
      # writeEnvFile()), which never has an omnibioai-tes/ checkout
      # sitting in it. Confirmed live against the real published image
      # (ghcr.io/omnibioai/omnibioai-app:latest) that its fallback
      # candidate path for that same read doesn't exist in the image
      # either -- this was already a silent, graceful (non-crashing)
      # empty-fallback gap before this fix, unrelated to and unchanged
      # by it, not something to paper over with a mount to a host path
      # that doesn't exist on a real user's machine.
      - ${MACHINE_DIR}/data/PubMed:/workspace/data/PubMed
      - ${WORK_DIR}/runs:/app/work/runs
      - ${WORK_DIR}/objects:/app/work/objects
      - ${WORK_DIR}/workflow_runner_exec:/app/work/workflow_runner_exec
      - ${WORK_DIR}/workflow_runner_runs:/app/work/workflow_runner_runs
      - ${WORK_DIR}/pathway_enrichment_runs:/app/work/pathway_enrichment_runs
      # #265: proxy's exposed socket, not the raw host one -- see the
      # docker-socket-proxy service above and DOCKER_HOST in
      # environment: above.
      - docker-proxy-socket:/var/run/proxy-socket:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      tes:
        condition: service_started
      toolserver:
        condition: service_started
      model-registry:
        condition: service_started
    command: ["bash", "-lc", "python manage.py migrate || (python manage.py migrate --fake-initial && python manage.py migrate) && python manage.py runserver 0.0.0.0:8000 --noreload"]
    restart: on-failure

  celery-worker:
    image: ghcr.io/omnibioai/omnibioai-app:latest
    environment:
      DEBUG: "1"
      DJANGO_SETTINGS_MODULE: omnibioai.settings
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      CELERY_BROKER_URL: redis://redis:6379/1
      TES_BASE_URL: http://tes:8081
      # #196: fixed call sites read GATEWAY_URL exclusively -- kept in
      # parity with docker-compose.release.yml's own copy of this fix.
      # TES_BASE_URL above stays pointed directly at TES (not repointed to
      # the gateway) -- other readers of it in this same image have no
      # bearer token attached and would silently 401 if this var suddenly
      # routed through gateway's AuthMiddleware.
      GATEWAY_URL: http://api-gateway:8080
      TOOLSERVER_BASE_URL: http://toolserver:9090
      MODEL_REGISTRY_BASE_URL: http://model-registry:8095
      RAG_BASE_URL: http://rag:8096
      OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OMNIBIOAI_HOST_APP_PREFIX: ${WORKSPACE_HOST}
      OMNIBIOAI_HOST_WORK_PREFIX: ${WORK_DIR}
      OMNIBIOAI_RUNS_ROOT: /app/work/runs
      # #54: talk to the docker-socket-proxy's exposed socket, not the
      # raw host one -- see docker-compose.yml's own celery-worker
      # comment for the full traffic-pattern analysis (same image, same
      # code) and its flagged, not-fixed alphafold/colabfold_docker.py
      # finding (applies here identically).
      DOCKER_HOST: unix:///var/run/proxy-socket/docker.sock
    volumes:
      - ${WORKSPACE_HOST}:/workspace
      - ${WORK_DIR}/runs:/app/work/runs
      - ${WORK_DIR}/objects:/app/work/objects
      - ${WORK_DIR}/workflow_runner_exec:/app/work/workflow_runner_exec
      - ${WORK_DIR}/workflow_runner_runs:/app/work/workflow_runner_runs
      - ${WORK_DIR}/pathway_enrichment_runs:/app/work/pathway_enrichment_runs
      # #54: proxy's exposed socket, not the raw host one -- see
      # DOCKER_HOST in environment: above.
      - docker-proxy-socket:/var/run/proxy-socket:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
      workbench:
        condition: service_started
    command: ["bash", "-lc", "celery -A omnibioai worker -l info"]
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Platform Services
  # ---------------------------------------------------------------------------

  model-registry:
    image: ghcr.io/omnibioai/omnibioai-model-registry:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8095:8095"
      - "${HOST_IP:-0.0.0.0}:5176:5176"
    environment:
      HOST: 0.0.0.0
      PORT: "8095"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      DB_NAME: model_registry
      OMNIBIOAI_MODEL_REGISTRY_ROOT: /registry
      # HIPAA remediation: kept in parity with docker-compose.release.yml
      # (dot) -- see that file's identical comment on this same block for
      # the full rationale.
      IAM_URL: http://auth-service:8001
      AUDIT_URL: http://security-audit:8004
      JWT_SECRET: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      AUTH_ENABLED: "true"
    volumes:
      - ${DATA_DIR}/model_registry:/registry
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  lims:
    image: ghcr.io/omnibioai/omnibioai-lims:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:7000:7000"
    environment:
      DJANGO_SETTINGS_MODULE: lab_data_manager.settings
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: limsdb
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      DJANGO_SECRET_KEY: ${LIMSX_DJANGO_SECRET_KEY:?LIMSX_DJANGO_SECRET_KEY must be set}
      FIELD_ENCRYPTION_KEY: ${LIMSX_FIELD_ENCRYPTION_KEY}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,lims,0.0.0.0,*"
      CORS_ALLOWED_ORIGINS: "https://webstudio.omnibioai.org,https://app.omnibioai.org,https://lims.omnibioai.org,https://omnibioai.org"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  rag:
    image: ghcr.io/omnibioai/omnibioai-rag:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8090:8096"
      - "${HOST_IP:-0.0.0.0}:5175:5175"
    environment:
      HOST: 0.0.0.0
      PORT: "8096"
      OLLAMA_BASE_URL: http://ollama:11434
      IAM_URL: http://auth-service:8001
      GATEWAY_URL: http://api-gateway:8080
      RAGBIO_API_KEY: ${RAGBIO_API_KEY:-}
      RAGBIO_HOST: 0.0.0.0
    depends_on:
      - ollama
    restart: on-failure

  control-center:
    image: ghcr.io/omnibioai/omnibioai-control-center:latest
    ports:
      # Loopback-only -- see docker-compose.release.yml's identical comment
      # (this file is kept in exposure parity with it; see
      # SECURITY-COMPOSE-HARDENING.md).
      - "127.0.0.1:7070:7070"
    environment:
      WORKSPACE_ROOT: /workspace
      OMNIBIOAI_BASE: /workspace/omnibioai
      TOOL_IMAGES_BASE: /workspace/tool-images
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
      # SSO Phase 2 PR1: same shared secret auth-service signs with and
      # api-gateway already verifies with (both above, AUTH_SECRET_KEY) --
      # this was previously unset here, so core/auth.py::require_admin's
      # os.environ.get("JWT_SECRET", "change-me") fallback silently
      # verified tokens against the public literal "change-me" instead of
      # the real secret.
      JWT_SECRET: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      # #54: talk to the docker-socket-proxy's exposed socket, not the
      # raw host one -- see docker-compose.yml's own control-center
      # comment for the full traffic-pattern analysis (same image, same
      # code: docker inspect/ps/images only, never /containers/create).
      DOCKER_HOST: unix:///var/run/proxy-socket/docker.sock
    volumes:
      - ${DATA_DIR}:/workspace
      # #54: proxy's exposed socket, not the raw host one -- see
      # DOCKER_HOST in environment: above.
      - docker-proxy-socket:/var/run/proxy-socket:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${DATA_DIR}/tool-images/sif:/workspace/tool-images/sif:ro
    command: >-
      sh -c "/usr/local/bin/pip install -q pytest pytest-cov pandas pytest-django django-environ django-extensions djangorestframework 2>&1 | grep -v '^Requirement' || true &&
      exec /usr/local/bin/uvicorn control_center.main:app --host 0.0.0.0 --port 7070"
    depends_on:
      - docker-socket-proxy
      - workbench
      - tes
      - toolserver
    restart: on-failure

  dev-hub:
    image: ghcr.io/omnibioai/omnibioai-dev-hub:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:5173:5173"
      - "${HOST_IP:-0.0.0.0}:8082:8082"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      OLLAMA_URL: http://ollama:11434/api
      OLLAMA_HOST: http://ollama:11434
      REPO_BASE: /repos
    volumes:
      - ${DATA_DIR}/dev-hub:/app/data
    depends_on:
      - ollama
    restart: on-failure

  workflow-bundles:
    image: ghcr.io/omnibioai/omnibioai-workflow-bundles:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8098:8098"
      - "${HOST_IP:-0.0.0.0}:5178:5178"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  tool-images:
    image: ghcr.io/omnibioai/omnibioai-tool-images:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8097:8097"
      - "${HOST_IP:-0.0.0.0}:5179:5179"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DATA_DIR}/tool-images/dockerfiles:/app/dockerfiles:ro
      - ${DATA_DIR}/tool-images/sif:/app/sif:ro
      - ${DATA_DIR}/tool-images/build_logs:/app/build_logs:ro
    restart: on-failure

  # ---------------------------------------------------------------------------
  # SDK / Launcher
  # ---------------------------------------------------------------------------

  launcher:
    image: ghcr.io/omnibioai/omnibioai-launcher:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:5190:5190"
    environment:
      REACT_APP_OMNIBIOAI_BASE_URL: ${OMNIBIOAI_BASE_URL:-http://localhost:8000}
      REACT_APP_OMNIBIOAI_TOKEN: ${OMNIBIOAI_TOKEN:-dev}
      REACT_APP_JUPYTER_BASE: ${JUPYTER_BASE:-http://localhost:8888}
      REACT_APP_JUPYTER_TOKEN: ${JUPYTER_TOKEN:?JUPYTER_TOKEN must be set}
      REACT_APP_USE_MOCK: "false"
    depends_on:
      workbench:
        condition: service_started
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Interactive Computing
  # ---------------------------------------------------------------------------

  jupyter:
    image: ghcr.io/omnibioai/omnibioai-jupyter:1.0
    container_name: omnibioai-jupyter
    ports:
      - "${HOST_IP:-0.0.0.0}:8888:8888"
    volumes:
      - ${DATA_DIR}:/home/jovyan/data
      - ${WORK_DIR}:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?JUPYTER_TOKEN must be set}
      GRANT_SUDO: "yes"
    depends_on:
      workbench:
        condition: service_started
    restart: unless-stopped

  rstudio:
    image: ghcr.io/omnibioai/omnibioai-rstudio:1.0
    container_name: omnibioai-rstudio
    ports:
      - "${HOST_IP:-0.0.0.0}:8787:8787"
    volumes:
      - ${DATA_DIR}:/home/rstudio/data
      - ${WORK_DIR}:/home/rstudio/work
    environment:
      PASSWORD: ${RSTUDIO_PASSWORD:?RSTUDIO_PASSWORD must be set}
      ROOT: "TRUE"
    depends_on:
      workbench:
        condition: service_started
    restart: unless-stopped

  vscode:
    image: ghcr.io/omnibioai/omnibioai-vscode:1.0
    container_name: omnibioai-vscode
    ports:
      - "${HOST_IP:-0.0.0.0}:8083:8080"
    volumes:
      - ${DATA_DIR}:/home/coder/data
      - ${WORK_DIR}:/home/coder/work
    environment:
      PASSWORD: ${VSCODE_PASSWORD:?VSCODE_PASSWORD must be set}
    depends_on:
      workbench:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Content & Media
  # ---------------------------------------------------------------------------

  videos:
    image: ghcr.io/omnibioai/omnibioai-videos:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8086:8086"
    volumes:
      - ${VIDEO_DIR}:/videos:ro
    restart: on-failure

  # ---------------------------------------------------------------------------
  # License Server
  # ---------------------------------------------------------------------------

  license-server:
    image: ghcr.io/omnibioai/omnibioai-license-server:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8099:8099"
    environment:
      LICENSE_SECRET: ${LICENSE_SECRET:?LICENSE_SECRET must be set}
      # PR11: ADMIN_KEY removed -- /api/license/generate and
      # /api/license/list are now IAM-authorized (Bearer JWT +
      # manage_licenses permission via omnibioai-auth), replacing the
      # static shared-secret check. Kept in parity with
      # docker-compose.release.yml -- see its comment for detail.
      GHCR_PULL_TOKEN: ${GHCR_PULL_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: omnibioai_licenses
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  web-ui:
    image: ghcr.io/omnibioai/omnibioai-web:latest
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Router
  # ---------------------------------------------------------------------------

  nginx-router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - workbench
      - web-ui
      - lims
      - rag
      - api-gateway
      - auth-service
      - control-center
      - grafana
      - videos
      - launcher
      - model-registry
      - workflow-bundles
      - tool-images
      - dev-hub
      - tes
      - toolserver
      - opa
      - jupyter
      - rstudio
      - vscode
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Plugin images — pulled on-demand by TES, not persistent services
  # ---------------------------------------------------------------------------
  # ghcr.io/omnibioai/omnibioai-plugin-scanpy:latest
  # ghcr.io/omnibioai/omnibioai-plugin-fastq-qc:latest
  # ghcr.io/omnibioai/omnibioai-plugin-fastq-trimmer:latest
  # ghcr.io/omnibioai/omnibioai-plugin-rnaseq-analysis:latest
  # ghcr.io/omnibioai/omnibioai-plugin-workflow-runner:latest
  # ghcr.io/omnibioai/omnibioai-plugin-marker-identification:latest
  # ghcr.io/omnibioai/omnibioai-plugin-phenotype-association:latest
  # ghcr.io/omnibioai/omnibioai-plugin-variant-annotation:latest

volumes:
  mysql_data:
  redis_data:
  ollama_data:
  grafana_data:
  # #265: docker-socket-proxy's exposed socket, shared with workbench.
  docker-proxy-socket:
