services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      MYSQL_DATABASE: ${MYSQL_DEFAULT_DB:-omnibioai}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ${DB_INIT_DIR}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Deploy-freshness check (issue #200/#194 pattern -- a container running
  # stale code relative to what's merged/available upstream, invisible
  # until someone happens to test the exact behavior that changed; hit 3x
  # in one session: celery-worker's rename regression, workbench's DAG-
  # count regression, toolserver's 91-day-stale ghcr.io image). Runs once,
  # compares each covered service's built/pulled image against what it
  # should reflect, writes findings to stdout + STALE_SERVICES.txt. Never
  # blocks startup -- see scripts/deploy_verify.py's own docstring for the
  # full design. Every service it covers depends on this one with
  # condition: service_completed_successfully below, so it runs
  # automatically on every `docker compose up`, including
  # `docker compose up -d <one-service>` -- no new command to remember.
  deploy-verify:
    image: python:3.12-slim
    # python:3.12-slim is a proper multi-arch manifest list (amd64/arm64/...),
    # but a stale amd64-tagged copy can be sitting in the local image cache
    # from an earlier pull (e.g. done on/for a different host arch). Without
    # pull_policy, `docker compose up` reuses whatever is already tagged
    # python:3.12-slim locally instead of re-resolving the tag -- so on an
    # arm64 host that stale amd64 layer gets run as-is and `exec /usr/bin/bash`
    # dies with "exec format error" (no qemu binfmt registered for it here).
    # pull_policy: always forces Compose to re-pull every run, which makes
    # Docker resolve the manifest list against the host's actual platform
    # (arm64 here, amd64 elsewhere) -- no platform: pin needed since the
    # image genuinely supports both.
    pull_policy: always
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-omnibioai-studio}
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir --quiet docker requests pyyaml && \
        python /workspace-config/scripts/deploy_verify.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-compose.yml:/workspace-config/docker-compose.yml:ro
      - ./.env:/workspace-config/.env:ro
      - ./scripts/deploy_verify.py:/workspace-config/scripts/deploy_verify.py:ro
      - ./STALE_SERVICES.txt:/workspace-config/STALE_SERVICES.txt:rw
      - ${MACHINE_DIR}/omnibioai/.git:/repos/omnibioai:ro
      - ${MACHINE_DIR}/omnibioai-tes/.git:/repos/omnibioai-tes:ro
    restart: "no"

  toolserver:
    image: ghcr.io/omnibioai/omnibioai-toolserver:latest
    restart: on-failure
    ports:
      - "${HOST_IP:-0.0.0.0}:9090:9090"
    environment:
      PYTHONUNBUFFERED: "1"
      IAM_URL: http://auth-service:8001
      AUDIT_URL: http://security-audit:8004
    # deploy-verify default (14d) is fine for this one -- no override.
    volumes:
      - ${WORKSPACE_HOST}:/workspace
    depends_on:
      mysql:
        condition: service_healthy
      deploy-verify:
        condition: service_completed_successfully

  tes:
    image: omnibioai-tes-local
    build:
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-tes/Dockerfile
      target: backend
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client
    restart: on-failure
    ports:
      - "${HOST_IP:-0.0.0.0}:8081:8081"
      - "${HOST_IP:-0.0.0.0}:5177:5177"
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/bin/docker
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHONPATH: /workspace/src
      # Mode B Phase 1A/1B run_store.py's own DB_* defaults (DB_USER=
      # DB_PASSWORD="omnibioai") never matched any real MySQL grant --
      # this block was flagged as a known TODO in that PR's own code
      # comment ("this repo's own docker-compose environment block still
      # needs that same DB_* set added... out of scope for this change")
      # and never followed up on, so every real submit() has been
      # crashing on RunStore.create()'s MySQL connect this whole time
      # (confirmed live: "Access denied for user 'omnibioai'@...").
      # Same shared DB, same DB_USER=root/DB_PASSWORD credential every
      # other service here already uses -- mirrors workflow-bundles'
      # own entry in this file exactly, not a new/guessed credential.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      TOOLSERVER_BASE_URL: http://toolserver:9090
      TES_TOOLS: /workspace/configs/tools
      TES_SERVERS: /workspace/configs/servers
      TMPDIR: /tmp/omnibioai_tes_runs
      IAM_URL: http://auth-service:8001
      # TES IAM integration: HS256 fallback secret for the shared IAM
      # client's local decode -- same var name/value already wired into
      # every other JWT_SECRET consumer in this file.
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      POLICY_URL: http://policy-engine:8002
      HPC_POLICY_URL: http://hpc-policy-engine:8003
      AUDIT_URL: http://security-audit:8004
      REDIS_URL: redis://redis:6379
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID:-}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID:-}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET:-}
      ATLASSIAN_SITE: ${ATLASSIAN_SITE:-}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL:-}
      ATLASSIAN_API_TOKEN: ${ATLASSIAN_API_TOKEN:-}
      OMNIBIOAI_EXTRA_MOUNTS: /usr/bin/docker:/usr/bin/singularity:/usr/bin/unsquashfs:/usr/bin/squashfuse:/usr/bin/fusermount:/usr/bin/fusermount3:/lib/aarch64-linux-gnu/libseccomp.so.2:/lib/aarch64-linux-gnu/liblzo2.so.2:/lib/aarch64-linux-gnu/liblzo2.so.2.0.0:/lib/aarch64-linux-gnu/libfuse3.so.3:/lib/aarch64-linux-gnu/libfuse3.so.3.14.0:/etc/singularity:/usr/lib/aarch64-linux-gnu/singularity:/var/lib/singularity:${MACHINE_DIR}/omnibioai-tool-images/sif:${MACHINE_DIR}/omnibioai
      SINGULARITY_CACHEDIR: /tmp/singularity_cache
      SINGULARITY_TMPDIR: /tmp/singularity_tmp
    volumes:
      - ${MACHINE_DIR}/omnibioai-tes:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/bin/singularity:/usr/bin/singularity:ro
      - /etc/slurm:/etc/slurm:ro
      - /usr/bin/unsquashfs:/usr/bin/unsquashfs:ro
      - /usr/bin/squashfuse:/usr/bin/squashfuse:ro
      - /usr/bin/fusermount:/usr/bin/fusermount:ro
      - /usr/bin/fusermount3:/usr/bin/fusermount3:ro
      - /lib/aarch64-linux-gnu/libseccomp.so.2:/lib/aarch64-linux-gnu/libseccomp.so.2:ro
      - /lib/aarch64-linux-gnu/liblzo2.so.2:/lib/aarch64-linux-gnu/liblzo2.so.2:ro
      - /lib/aarch64-linux-gnu/liblzo2.so.2.0.0:/lib/aarch64-linux-gnu/liblzo2.so.2.0.0:ro
      - /lib/aarch64-linux-gnu/libfuse3.so.3:/lib/aarch64-linux-gnu/libfuse3.so.3:ro
      - /lib/aarch64-linux-gnu/libfuse3.so.3.14.0:/lib/aarch64-linux-gnu/libfuse3.so.3.14.0:ro
      - /usr/lib/aarch64-linux-gnu/singularity:/usr/lib/aarch64-linux-gnu/singularity:ro
      - /var/lib/singularity:/var/lib/singularity:rw
      - /var/run/munge:/var/run/munge:ro
      - /etc/singularity:/etc/singularity:ro
      - ${MACHINE_DIR}/omnibioai-workflow-bundles:${MACHINE_DIR}/omnibioai-workflow-bundles:ro
      - ${MACHINE_DIR}/omnibioai:${MACHINE_DIR}/omnibioai:rw
      - ${MACHINE_DIR}/omnibioai-tool-images:${MACHINE_DIR}/omnibioai-tool-images:ro
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
      - ${DATA_DIR}/tool-images/sif:/sif:ro
    command:
      - bash
      - -lc
      - |
        service nginx start && \
        omnibioai-tes serve \
          --host 0.0.0.0 \
          --port 8081 \
          --tools /workspace/configs/tools \
          --servers /workspace/configs/servers
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      toolserver:
        condition: service_started
      deploy-verify:
        condition: service_completed_successfully

  model-registry:
    build:
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-model-registry/Dockerfile
      target: backend
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client
    restart: on-failure
    # image: ghcr.io/omnibioai/omnibioai-model-registry:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8095:8095"
      - "${HOST_IP:-0.0.0.0}:5176:5176"
    environment:
      HOST: 0.0.0.0
      PORT: "8095"
      USAGE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      DB_NAME: model_registry
      OMNIBIOAI_MODEL_REGISTRY_ROOT: /registry
      IAM_URL: http://auth-service:8001
      AUDIT_URL: http://security-audit:8004
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      AUTH_ENABLED: "true"
      HF_TOKEN: ${HF_TOKEN:-}
      HF_DEFAULT_NAMESPACE: ${HF_DEFAULT_NAMESPACE:-omnibioai}

    volumes:
      - ${MACHINE_DIR}/data/local_registry/model_registry:/registry
      - ${WORK_DIR}/runs:/app/work/runs:ro
    depends_on:
      mysql:
        condition: service_healthy

  billing-service:
    build:
      context: ${MACHINE_DIR}/omnibioai-billing
      dockerfile: Dockerfile
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client
    restart: on-failure
    ports:
      - "${HOST_IP:-0.0.0.0}:8005:8005"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai_billing
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      USAGE_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      IAM_URL: http://auth-service:8001
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  billing-worker:
    build:
      context: ${MACHINE_DIR}/omnibioai-billing
      dockerfile: Dockerfile.worker
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client (pre-existing gap, same as billing-service above -- Dockerfile.worker's requirements.txt install needs it too, just never hit a cold build until now)
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai_billing
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      USAGE_REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  lims:
    build:
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-lims/Dockerfile
      target: backend
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client
    image: omnibioai-lims-local
    restart: on-failure
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      DJANGO_SETTINGS_MODULE: lab_data_manager.settings
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: limsdb
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      DJANGO_SECRET_KEY: ${LIMSX_DJANGO_SECRET_KEY:-omnibioai-studio-secret}
      FIELD_ENCRYPTION_KEY: ${LIMSX_FIELD_ENCRYPTION_KEY}
      # omnibioai-auth's JWT signing key -- same shared secret already wired
      # into workbench, control-center, api-gateway, model-registry. Distinct
      # from DJANGO_SECRET_KEY above, which only signs LIMS's own
      # self-issued cookie tokens (core/api/cookie_auth.py) and is NOT
      # interoperable with omnibioai-auth tokens.
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      # PR10: omnibioai-iam-client's base URL -- same var name/value already
      # wired into every other IAM_URL consumer in this compose file.
      # LIMS's authentication now goes through the IAM client (RS256/JWKS +
      # revocation checking) instead of decoding tokens locally.
      IAM_URL: http://auth-service:8001
      LIMS_SSO_CLIENT_ID: ${LIMS_SSO_CLIENT_ID:-omnibioai-lims}
      LIMS_SSO_CLIENT_SECRET: ${LIMS_SSO_CLIENT_SECRET}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,lims,0.0.0.0,*"
      CORS_ALLOWED_ORIGINS: "https://webstudio.omnibioai.org,https://app.omnibioai.org,https://lims.omnibioai.org,https://omnibioai.org"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ${MACHINE_DIR}/omnibioai-lims/core:/app/core
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  neo4j:
    image: neo4j:5.15
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-omnibioai}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  rag:
    build:
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-rag/Dockerfile
      target: backend
      args:
        GITHUB_TOKEN: ${GHCR_PULL_TOKEN}      # required: read:packages for @man4ish/ui (pre-existing npm auth, ui-builder stage only)
        RAGBIO_API_KEY: ${RAGBIO_API_KEY}  # embedded as VITE_RAGBIO_API_KEY in JS bundle
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-iam-client (backend stage, separate from the npm ARG above)
    restart: on-failure
    # image: ghcr.io/omnibioai/omnibioai-rag:latest
    # Frontend served at http://localhost:8090/ via nginx (port 5175 inside container)
    ports:
      - "${HOST_IP:-0.0.0.0}:8090:8096"
      - "${HOST_IP:-0.0.0.0}:5175:5175"
    environment:
      HOST: 0.0.0.0
      PORT: "8096"
      USAGE_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      OLLAMA_BASE_URL: http://ollama:11434
      IAM_URL: http://auth-service:8001
      GATEWAY_URL: http://api-gateway:8080
      RAGBIO_API_KEY: ${RAGBIO_API_KEY}
      RAGBIO_HOST: 0.0.0.0
      CORS_ORIGINS: "http://localhost,http://localhost:5174,http://localhost:5175"
      RAG_QUERY_TIMEOUT: "300"
      RAG_LLM_TIMEOUT: "300"
      NCBI_EMAIL: ${NCBI_EMAIL}
      NCBI_API_KEY: ${NCBI_API_KEY}
      RAG_DATA_DIR: /workspace/data/PubMed
      FAISS_INDEX_DIR: /workspace/data/Index
      RAG_QUERY_EXPANSION: "true"
      RAG_RERANKING: "true"
      RAG_RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-omnibioai}
      NEO4J_ENABLED: "true"
      HYBRID_SEARCH_ENABLED: "true"
      KG_EXTRACT_MODEL: "llama3:latest"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RAG_CACHE_ENABLED: "true"
      RAG_CACHE_TTL: "3600"
      REDIS_URL: redis://redis:6379
    volumes:
      - ${DATA_DIR}/PubMed:/workspace/data/PubMed
      - ${DATA_DIR}/PubMed/Index:/workspace/data/Index
    depends_on:
      ollama:
        condition: service_started
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy

  # #265: policy-enforcing proxy in front of the real host docker.sock,
  # for the workbench service specifically (its ~50 ML plugin executors
  # via omnibioai/plugin_executor/ml_utils.py are the dominant real
  # docker.sock consumer -- see docker-socket-proxy/policy.py's module
  # docstring for the full threat model and grep evidence). Blocks
  # EXEC/SWARM/SECRETS/NETWORKS-management/VOLUMES-management/BUILD/etc.
  # outright, and validates every /containers/create body so it can't
  # request --privileged, added capabilities, host networking/PID/IPC
  # namespaces, or a bind mount outside PROXY_ALLOWED_BIND_PREFIXES --
  # closing the actual "ask the daemon for a container with a host-root
  # bind mount" escape, not just narrowing the API surface. Real,
  # adversarially-tested end to end against a live Docker daemon (see
  # docker-socket-proxy/tests/test_proxy_live_integration.py).
  #
  # NOT yet applied to this file's other 5 docker.sock-RW-mounted
  # services (tes, celery-worker, control-center, launcher,
  # workflow-bundles) or to workflow_runner's own nested sibling-
  # container dispatch (which still bind-mounts the raw host socket
  # into containers *it* spawns, for Nextflow's Docker-in-Docker
  # executor) -- tracked as its own follow-up (#54), not silently left
  # uncovered.
  docker-socket-proxy:
    build:
      context: ./docker-socket-proxy
    restart: on-failure
    environment:
      PROXY_LISTEN_SOCKET: /var/run/proxy-socket/docker.sock
      DOCKER_SOCK_PATH: /var/run/docker-real.sock
      # #265: omnibioai/plugin_executor/ml_utils.py's real docker run
      # bind-mounts THREE host paths, not just WORK_DIR (confirmed by
      # reading its actual cmd construction + live env vars in the
      # running container): the run's own work_dir under WORK_DIR, a
      # model registry root that defaults to a path under
      # ${MACHINE_DIR}/data, and an ML cache dir that -- since
      # OMNIBIOAI_ML_CACHE_DIR is unset in this deployment today --
      # resolves to /root/.cache/omnibioai/torch on the host (the
      # container's own $HOME under to_host_path()'s pass-through
      # fallback; an existing quirk of that unset env var, not
      # something this proxy changes or should silently break by
      # narrowing). All three are listed so legitimate ML plugin
      # dispatch keeps working exactly as it does today.
      PROXY_ALLOWED_BIND_PREFIXES: ${WORK_DIR},${MACHINE_DIR}/data,/root/.cache/omnibioai/torch
    volumes:
      - /var/run/docker.sock:/var/run/docker-real.sock
      - docker-proxy-socket:/var/run/proxy-socket

  workbench:
    build:
      context: ${MACHINE_DIR}/omnibioai-workbench
      dockerfile: Dockerfile.app
      target: backend
      secrets:
        - github_token      # required: repo/Contents:Read on private omnibioai-usage-client, omnibioai-iam-client
    restart: on-failure
    # image: ghcr.io/omnibioai/omnibioai-app:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8000:8000"
    environment:
      # #265: talk to the docker-socket-proxy's exposed socket, not the
      # raw host one -- the volumes: block below no longer mounts
      # /var/run/docker.sock directly. docker CLI and docker-py both
      # honor DOCKER_HOST for a unix socket path.
      DOCKER_HOST: unix:///var/run/proxy-socket/docker.sock
      # issue #38: was DEBUG: "1" -- vestigial, settings.py never read it.
      # Now wired to the real env var (omnibioai/settings.py:143), default off.
      DJANGO_DEBUG: "false"
      # issue #38 follow-up: SECRET_KEY rotation. Old (potentially-exposed)
      # key kept in FALLBACKS until the bake-period end date noted on #38.
      DJANGO_SECRET_KEY: ${WORKBENCH_DJANGO_SECRET_KEY}
      DJANGO_SECRET_KEY_FALLBACKS: ${WORKBENCH_DJANGO_SECRET_KEY_FALLBACKS:-}
      CSRF_EXTRA_ORIGINS: "http://localhost:5174,http://localhost:8000,http://${HOST_IP:-192.168.86.234}:5174,http://${HOST_IP:-192.168.86.234}:8000"
      DJANGO_SETTINGS_MODULE: omnibioai.settings
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      REDIS_HOST: redis
      USAGE_REDIS_URL: redis://redis:6379
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TES_BASE_URL: http://tes:8081
      OLLAMA_BASE_URL: http://ollama:11434
      TOOLSERVER_BASE_URL: http://toolserver:9090
      MODEL_REGISTRY_BASE_URL: http://model-registry:8095
      ORCHESTRATOR_MAX_RETRIES: "10"
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      RAG_BASE_URL: http://rag:8096
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODE_LLM_MODEL: ${CODE_LLM_MODEL:-qwen2.5-coder:32b}
      REASONING_LLM_MODEL: ${REASONING_LLM_MODEL:-deepseek-r1:32b}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-deepseek-r1:32b}
      OMNIBIOAI_TES_URL: http://tes:8081
      OMNIBIOAI_HOST_APP_PREFIX: ${WORKSPACE_HOST}
      OMNIBIOAI_WORK_DIR: ${WORK_DIR}
      OMNI_OBJECT_STORAGE_DIR: /app/work/objects
      OMNI_OBJECT_REGISTRY_PATH: /app/work/object_registry.json
      OMNIBIOAI_RUNS_ROOT: /app/work/runs
      BIOQUERYAI_SANDBOX_SIF: ${MACHINE_DIR}/omnibioai-tool-images/sif/bioqueryai_sandbox.sif
      OMNIBIOAI_MYSQL_HOST: mysql
      GATEWAY_URL: http://api-gateway:8080
      RAGBIO_API_KEY: ${RAGBIO_API_KEY}
      RAGBIO_HOST: 0.0.0.0
      OMNIBIOAI_MYSQL_PORT: "3306"
      OMNIBIOAI_MYSQL_USER: root
      OMNIBIOAI_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      OMNIBIOAI_MYSQL_DB: omnibioai
      LIMS_BASE_URL: "http://lims:7000"
      LIMS_USERNAME: ${LIMS_USERNAME:-admin}
      LIMS_PASSWORD: ${LIMS_PASSWORD:-omnibioai}
      LIMS_REFRESH_TOKEN: ${LIMS_REFRESH_TOKEN:-}
      LIMS_API_TOKEN: ""
      # bio_agent -> auth-service TES credential (issue #195): dedicated
      # scientist-role service account, same shape as the LIMS_* block
      # above. auth-service isn't otherwise wired to workbench, hence the
      # explicit URL rather than reusing IAM_URL (that var belongs to
      # api-gateway/security-audit's own env blocks, not this service's).
      BIO_AGENT_AUTH_URL: "http://auth-service:8001"
      BIO_AGENT_SVC_EMAIL: ${BIO_AGENT_SVC_EMAIL:-}
      BIO_AGENT_SVC_PASSWORD: ${BIO_AGENT_SVC_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
      OMNIBIOAI_HOST_WORK_PREFIX: ${WORK_DIR}
      OMNIBIOAI_ML_TUTORIALS_DIR: /workspace/omnibioai-docs/tutorials/ml
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      MS_GRAPH_ENABLED: ${MS_GRAPH_ENABLED:-false}
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID:-}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID:-}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET:-}
      ATLASSIAN_SITE: ${ATLASSIAN_SITE:-}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL:-}
      ATLASSIAN_API_TOKEN: ${ATLASSIAN_API_TOKEN:-}
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SERVICENOW_CLIENT_ID: ${SERVICENOW_CLIENT_ID:-}
      SERVICENOW_CLIENT_SECRET: ${SERVICENOW_CLIENT_SECRET:-}
    volumes:
      - ${WORKSPACE_HOST}:/workspace
      - ${MACHINE_DIR}/omnibioai-docs:/workspace/omnibioai-docs:ro
      - ${MACHINE_DIR}/omnibioai-workflow-bundles:/workspace/omnibioai-workflow-bundles:ro
      - ${WORK_DIR}/runs:/app/work/runs
      - ${WORK_DIR}/objects:/app/work/objects
      - ${WORK_DIR}/workflow_runner_exec:/app/work/workflow_runner_exec
      - ${WORK_DIR}/workflow_runner_runs:/app/work/workflow_runner_runs
      - ${WORK_DIR}/pathway_enrichment_runs:/app/work/pathway_enrichment_runs
      # #265: proxy's exposed socket, not the raw host one -- see the
      # docker-socket-proxy service above and DOCKER_HOST in
      # environment: above. :ro because workbench only ever needs to
      # *connect to* this socket file, never write to it.
      - docker-proxy-socket:/var/run/proxy-socket:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
      - /media:/media:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      tes:
        condition: service_started
      toolserver:
        condition: service_started
      model-registry:
        condition: service_started
      deploy-verify:
        condition: service_completed_successfully
    command: ["bash", "-lc", "python manage.py migrate || (python manage.py migrate --fake-initial && python manage.py migrate) && python manage.py runserver 0.0.0.0:8000 --noreload"]

  celery-worker:
    build:
      context: ${MACHINE_DIR}/omnibioai-workbench
      dockerfile: Dockerfile.app
      target: backend
    restart: on-failure
    # image: ghcr.io/omnibioai/omnibioai-app:latest
    environment:
      # issue #38: was DEBUG: "1" -- vestigial, settings.py never read it.
      # Now wired to the real env var (omnibioai/settings.py:143), default off.
      DJANGO_DEBUG: "false"
      # issue #38 follow-up: SECRET_KEY rotation. Old (potentially-exposed)
      # key kept in FALLBACKS until the bake-period end date noted on #38.
      DJANGO_SECRET_KEY: ${WORKBENCH_DJANGO_SECRET_KEY}
      DJANGO_SECRET_KEY_FALLBACKS: ${WORKBENCH_DJANGO_SECRET_KEY_FALLBACKS:-}
      CSRF_EXTRA_ORIGINS: "http://localhost:5174,http://localhost:8000,http://${HOST_IP:-192.168.86.234}:5174,http://${HOST_IP:-192.168.86.234}:8000"
      DJANGO_SETTINGS_MODULE: omnibioai.settings
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      REDIS_HOST: redis
      USAGE_REDIS_URL: redis://redis:6379
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TES_BASE_URL: http://tes:8081
      # #196: the 4 fixed TES call sites (bio_agent's factories,
      # step_executor.py, workflow_runner/views.py, catalog/services.py)
      # now read GATEWAY_URL exclusively, not TES_BASE_URL/
      # OMNIBIOAI_TES_URL -- workbench already had this var, celery-worker
      # didn't. TES_BASE_URL above is deliberately left pointed directly at
      # TES (not repointed to the gateway) -- other, not-yet-fixed readers
      # of it in this same image (bioquery_tasks.py, #209) have no bearer
      # token attached and would silently 401 if this var suddenly routed
      # through gateway's AuthMiddleware.
      GATEWAY_URL: http://api-gateway:8080
      TOOLSERVER_BASE_URL: http://toolserver:9090
      MODEL_REGISTRY_BASE_URL: http://model-registry:8095
      ORCHESTRATOR_MAX_RETRIES: "10"
      RAG_BASE_URL: http://rag:8096
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODE_LLM_MODEL: ${CODE_LLM_MODEL:-qwen2.5-coder:32b}
      REASONING_LLM_MODEL: ${REASONING_LLM_MODEL:-deepseek-r1:32b}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-deepseek-r1:32b}
      OMNIBIOAI_HOST_WORK_PREFIX: ${WORK_DIR}
      SENTRY_DSN: ${SENTRY_DSN:-}
      MS_GRAPH_ENABLED: ${MS_GRAPH_ENABLED:-false}
    volumes:
      - ${WORKSPACE_HOST}:/workspace
      - ${WORK_DIR}/runs:/app/work/runs
      - ${WORK_DIR}/objects:/app/work/objects
      - ${WORK_DIR}/workflow_runner_exec:/app/work/workflow_runner_exec
      - ${WORK_DIR}/workflow_runner_runs:/app/work/workflow_runner_runs
      - ${WORK_DIR}/pathway_enrichment_runs:/app/work/pathway_enrichment_runs
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    depends_on:
      workbench:
        condition: service_started
      deploy-verify:
        condition: service_completed_successfully
    command: ["bash", "-lc", "celery -A omnibioai worker -l info"]

  control-center:
    build:
      context: ${MACHINE_DIR}/omnibioai-control-center
      dockerfile: Dockerfile
      target: backend
    restart: on-failure
    runtime: nvidia
    # image: ghcr.io/omnibioai/omnibioai-control-center:latest
    ports:
      # Bound to localhost only — blocks all external network access
      # generate_report.py can still reach it via 127.0.0.1:7070 on the host
      # All browser/API access goes through nginx /_svc/control (JWT required)
      # Prometheus scrapes via Docker internal network (unaffected)
      - "127.0.0.1:7070:7070"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WORKSPACE_ROOT: /workspace
      WORK_DIR: /workspace/omnibioai-work
      OMNIBIOAI_BASE: /workspace/omnibioai
      TOOL_IMAGES_BASE: /workspace/omnibioai-tool-images
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: "0.7.0"
      SENTRY_API_TOKEN: ${SENTRY_API_TOKEN:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT_SLUGS: ${SENTRY_PROJECT_SLUGS:-}
      REPORT_SCHEDULE_HOURS: ${REPORT_SCHEDULE_HOURS:-6}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Separate webhook from DISCORD_WEBHOOK_URL above (GPU temp alerts) --
      # fires only for genuinely new high-severity known-issue entries.
      # Empty default disables alerting gracefully, same as SENTRY_DSN.
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-omnibioai}
      GHCR_PULL_TOKEN: ${GHCR_PULL_TOKEN:-}
      # Same shared secret already wired into workbench, api-gateway, and
      # model-registry -- lets require_admin() validate omnibioai-auth-issued
      # JWTs locally (HS256) without a network round trip.
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      # Same shared service secret already wired into rag and the gateway
      # blocks below. Without this, routes_rag_proxy.py's RAGBIO_API_KEY
      # env var is empty, so it sends /rag/studies and /rag/cache-stats to
      # RAG with no Authorization header at all -- RAG rejects the request,
      # and the Admin Console's RAG/PubMed tab reads that as a session
      # failure even though the admin's own JWT was never the problem.
      RAGBIO_API_KEY: ${RAGBIO_API_KEY}
      # PR14.5D: routes_billing_proxy.py's httpx relay target. Matches its
      # own os.environ.get(..., "http://billing-service:8005") default
      # already, so this isn't functionally required -- set explicitly
      # anyway, same as every other cross-service URL in this file
      # (RAG_BASE_URL, MODEL_REGISTRY_BASE_URL, GATEWAY_URL, ...), so the
      # wiring is discoverable here instead of only in the other repo.
      BILLING_URL: http://billing-service:8005
      # Narrow, single-file mount (not the whole /var/spool/cron directory)
      # for POST /cron/jobs/{id}/pause|resume and PUT .../schedule. The
      # container runs as root, so it can read/write this file regardless of
      # its manish:crontab ownership -- no crontab CLI/package needed, since
      # standard Debian cron polls each spool file's mtime and reloads
      # automatically, without requiring the change to go through the
      # crontab binary itself.
      CRONTAB_SPOOL_PATH: /var/spool/cron/crontabs/manish
    volumes:
        - ${MACHINE_DIR}:/workspace
        - /media/manish/OmniBioAI-SIFs/work:/media/manish/OmniBioAI-SIFs/work
        - /media/manish/OmniBioAI-SIFs/reference:/media/manish/OmniBioAI-SIFs/reference
        - /media/manish/OmniBioAI-SIFs/omnibioai-test-data:/media/manish/OmniBioAI-SIFs/omnibioai-test-data
        - /home/manish/Desktop/machine/data:/home/manish/Desktop/machine/data
        - /var/run/docker.sock:/var/run/docker.sock
        - /usr/bin/docker:/usr/bin/docker:ro
        - /var/spool/cron/crontabs/manish:/var/spool/cron/crontabs/manish
        - ${MACHINE_DIR}/omnibioai-control-center/backend/src:/app/src
        - ${MACHINE_DIR}/omnibioai-control-center/scripts:/app/scripts
        - ${MACHINE_DIR}/omnibioai-control-center/frontend/cc-ui/dist:/app/dist
        - ${MACHINE_DIR}/omnibioai-control-center/config:/config:ro
        - ${MACHINE_DIR}/omnibioai-tool-images/sif:/workspace/omnibioai-tool-images/sif:ro
    command: >-
      sh -c "/usr/local/bin/pip install -q pytest pytest-cov pandas pytest-django django-environ django-extensions djangorestframework 2>&1 | grep -v '^Requirement' || true &&
      exec /usr/local/bin/uvicorn control_center.main:app --host 0.0.0.0 --port 7070"
    depends_on:
      - workbench
      - tes
      - toolserver
      - billing-service

  # PR14.7B: control-center's Stage 3 (nginx) -- serves both frontend
  # bundles (dist-control/dist-admin, host-based split by Host header,
  # see omnibioai-control-center/docker/nginx/control-center.conf) and
  # proxies every API path through to the SAME control-center backend
  # service above (no second backend, no duplicated container). Bound to
  # localhost only, matching that service's own convention. Not yet
  # reachable from outside this host -- /etc/cloudflared/config.yml still
  # points control.omnibioai.org directly at control-center:7070; wiring
  # this port in there (and adding admin.omnibioai.org) is deliberately
  # separate follow-up work, not part of this PR.
  control-center-web:
    build:
      context: ${MACHINE_DIR}/omnibioai-control-center
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_LIMS_SSO_CLIENT_ID: ${LIMS_SSO_CLIENT_ID:-omnibioai-lims}
        VITE_LIMS_SSO_REDIRECT_URI: ${LIMS_SSO_REDIRECT_URI:-https://lims.omnibioai.org/sso/callback}
    restart: on-failure
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - control-center

  dev-hub:
    build:
      context: ${MACHINE_DIR}/omnibioai-dev-hub
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${HOST_IP:-0.0.0.0}:5173:5173"
      - "${HOST_IP:-0.0.0.0}:8082:8082"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      OLLAMA_URL: http://ollama:11434/api
      OLLAMA_HOST: http://ollama:11434
      REPO_BASE: /repos
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      AUTH_ENABLED: "true"
    volumes:
      - ${MACHINE_DIR}/omnibioai-dev-hub/data:/app/data
      - ${MACHINE_DIR}/omnibioai:/repos/omnibioai:ro
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
      - ${MACHINE_DIR}/omnibioai-rag:/repos/omnibioai-rag:ro
      - ${MACHINE_DIR}/omnibioai-toolserver:/repos/omnibioai-toolserver:ro
      - ${MACHINE_DIR}/omnibioai-sdk:/repos/omnibioai-sdk:ro
      - ${MACHINE_DIR}/omnibioai-workflow-bundles:/repos/omnibioai-workflow-bundles:ro
      - ${MACHINE_DIR}/omnibioai-control-center:/repos/omnibioai-control-center:ro
      - ${MACHINE_DIR}/omnibioai-lims:/repos/omnibioai-lims:ro
      - ${MACHINE_DIR}/omnibioai-model-registry:/repos/omnibioai-model-registry:ro
      - ${MACHINE_DIR}/omnibioai-dev-docker:/repos/omnibioai-dev-docker:ro
      - ${MACHINE_DIR}/omnibioai-docs:/repos/omnibioai-docs:ro
      - ${MACHINE_DIR}/omnibioai-studio:/repos/omnibioai-studio:ro
      - ${MACHINE_DIR}/omnibioai-api-gateway:/repos/omnibioai-api-gateway:ro
      - ${MACHINE_DIR}/omnibioai-auth:/repos/omnibioai-auth:ro
      - ${MACHINE_DIR}/omnibioai-tool-runtime:/repos/omnibioai-tool-runtime:ro
      - ${MACHINE_DIR}/omnibioai-iam-client:/repos/omnibioai-iam-client:ro
      - ${MACHINE_DIR}/omnibioai-policy-engine:/repos/omnibioai-policy-engine:ro
      - ${MACHINE_DIR}/omnibioai-security-sdk:/repos/omnibioai-security-sdk:ro
    depends_on:
      - ollama
    restart: on-failure

  launcher:
    build:
      context: ${MACHINE_DIR}/omnibioai-launcher
      dockerfile: Dockerfile
      # CRA bakes REACT_APP_* vars in at `npm run build` time, not at container
      # runtime -- the `environment:` block below only reaches the already-built
      # bundle's (irrelevant) process.env, so these have to be repeated here as
      # build args or the src/*.jsx hardcoded fallbacks are the only value that
      # ever actually ships.
      args:
        REACT_APP_OMNIBIOAI_BASE_URL: ${OMNIBIOAI_BASE_URL:-http://192.168.86.234:8000}
        REACT_APP_OMNIBIOAI_TOKEN: ${OMNIBIOAI_TOKEN:-dev}
        REACT_APP_JUPYTER_BASE: ${JUPYTER_BASE:-http://192.168.86.234:8890}
        REACT_APP_JUPYTER_TOKEN: ${JUPYTER_TOKEN:-devtoken}
        REACT_APP_USE_MOCK: "false"
    ports:
      - "${HOST_IP:-0.0.0.0}:5190:5190"
    environment:
      REACT_APP_OMNIBIOAI_BASE_URL: ${OMNIBIOAI_BASE_URL:-http://192.168.86.234:8000}
      REACT_APP_OMNIBIOAI_TOKEN: ${OMNIBIOAI_TOKEN:-dev}
      REACT_APP_JUPYTER_BASE: ${JUPYTER_BASE:-http://192.168.86.234:8890}
      REACT_APP_JUPYTER_TOKEN: ${JUPYTER_TOKEN:-devtoken}
      REACT_APP_USE_MOCK: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    depends_on:
      workbench:
        condition: service_started

  jupyter:
    image: ghcr.io/omnibioai/omnibioai-jupyter:1.0
    container_name: omnibioai-jupyter
    ports:
      - "${HOST_IP:-0.0.0.0}:8888:8888"
    volumes:
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-omnibioai}
      - GRANT_SUDO=yes
    restart: unless-stopped
    depends_on:
      workbench:
        condition: service_started

  rstudio:
    image: ghcr.io/omnibioai/omnibioai-rstudio:1.0
    container_name: omnibioai-rstudio
    ports:
      - "${HOST_IP:-0.0.0.0}:8787:8787"
    volumes:
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
    environment:
      - PASSWORD=${RSTUDIO_PASSWORD:-omnibioai}
      - ROOT=TRUE
    restart: unless-stopped
    depends_on:
      workbench:
        condition: service_started

  vscode:
    image: ghcr.io/omnibioai/omnibioai-vscode:1.0
    container_name: omnibioai-vscode
    ports:
      - "${HOST_IP:-0.0.0.0}:8083:8080"
    volumes:
      - ${MACHINE_DIR}/data:${MACHINE_DIR}/data
      - ${MACHINE_DIR}/work:${MACHINE_DIR}/work
    environment:
      - PASSWORD=${VSCODE_PASSWORD:-omnibioai}
    restart: unless-stopped
    depends_on:
      workbench:
        condition: service_started

  workflow-bundles:
    build:
      # Build context expanded to $MACHINE_DIR (sibling repos) so the
      # Dockerfile can COPY in omnibioai-iam-client -- same pattern as
      # model-registry below. All COPY paths inside the Dockerfile are
      # now repo-prefixed (omnibioai-workflow-bundles/...) accordingly.
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-workflow-bundles/Dockerfile
      target: backend
    # image: ghcr.io/omnibioai/omnibioai-workflow-bundles:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8098:8098"
      - "${HOST_IP:-0.0.0.0}:5178:5178"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      # api/iam.py's AsyncIAMClient cache lookup (AUTH_REDIS_URL, falling
      # back to this) was previously unset here, so it fell all the way
      # back to its own hard-coded "redis://localhost:6379/0" -- inside
      # this container, "localhost" has no Redis listening on it at all,
      # so every request crashed with a raw ConnectionError instead of
      # either hitting cache or degrading gracefully. /0 matches that
      # same fallback's own db index, same as api/audit.py's separate
      # AUDIT_REDIS connection already does for its default.
      REDIS_URL: redis://redis:6379/0
      # Previously unset here too, so api/iam.py's JWT_SECRET fell back
      # to its own hard-coded "change-me" -- never matches the real
      # signing key, so AsyncIAMClient.get_user()'s local decode step
      # always threw and returned None before ever reaching the
      # /auth/validate network call below, i.e. every cache-miss request
      # failed closed as 401 regardless of the token's real validity.
      # Same source of truth every other JWT_SECRET consumer in this
      # file already uses (tes, auth-service, control-center, rag, ...).
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      # Previously unset here too, so api/iam.py's AUTH_SERVICE_URL fell
      # back to its own hard-coded "http://auth:8000" -- no service
      # named "auth" exists on this network (the real one is
      # "auth-service" on port 8001, same as every other IAM_URL/
      # AUTH_SERVICE_URL consumer in this file already points at), so
      # the /auth/validate fallback call would have failed to connect
      # even if JWT_SECRET above had been correct.
      AUTH_SERVICE_URL: http://auth-service:8001
      # Bundle path that resolves identically inside the container and on the
      # host — required so that `docker run -v {bundle_path}:/workspace` mounts
      # the correct host directory when spawning sibling runner containers.
      BUNDLES_ROOT: ${MACHINE_DIR}/omnibioai-workflow-bundles
      # Shared runs dir mounted at its host path so `-v {run_out_dir}:/runs`
      # in the spawned container resolves from the host filesystem.
      RUNS_ROOT: ${RUNS_DIR:-/tmp/omnibioai-runs}
      RUNNER_IMAGE: ghcr.io/omnibioai/omnibioai-plugin-workflow-runner:1.0.0
    volumes:
      # Docker socket — lets api/server.py spawn sibling runner containers
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      # Bundles mounted at the same absolute path as on the host so that the
      # path used in `docker run -v` is valid from Docker's (host) perspective
      - ${MACHINE_DIR}/omnibioai-workflow-bundles:${MACHINE_DIR}/omnibioai-workflow-bundles
      # Shared runs dir — inputs.json written here by the API is visible to
      # the runner container via the same host path
      - ${RUNS_DIR:-/tmp/omnibioai-runs}:${RUNS_DIR:-/tmp/omnibioai-runs}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  tool-images:
    build:
      context: ${MACHINE_DIR}/omnibioai-tool-images
      dockerfile: Dockerfile
      target: backend
    # image: ghcr.io/omnibioai/omnibioai-tool-images:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8097:8097"
      - "${HOST_IP:-0.0.0.0}:5179:5179"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MACHINE_DIR}/omnibioai-tool-images/dockerfiles:/app/dockerfiles:ro
      - ${MACHINE_DIR}/omnibioai-tool-images/sif:/app/sif:ro
      - ${MACHINE_DIR}/omnibioai-tool-images/build_logs:/app/build_logs:ro
    restart: on-failure

  videos:
    image: ghcr.io/omnibioai/omnibioai-videos:latest
    restart: on-failure
    ports:
      - "8086:8086"
    volumes:
      - ${VIDEO_DIR}:/videos:ro

  opa:
    image: openpolicyagent/opa:latest
    restart: on-failure
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr=0.0.0.0:8181"]

  # Plugin images (pulled on-demand by TES, not persistent services):
  # ghcr.io/omnibioai/omnibioai-plugin-scanpy:latest
  # ghcr.io/omnibioai/omnibioai-plugin-fastq-qc:latest
  # ghcr.io/omnibioai/omnibioai-plugin-fastq-trimmer:latest
  # ghcr.io/omnibioai/omnibioai-plugin-rnaseq-analysis:latest
  # ghcr.io/omnibioai/omnibioai-plugin-workflow-runner:latest
  # ghcr.io/omnibioai/omnibioai-plugin-marker-identification:latest
  # ghcr.io/omnibioai/omnibioai-plugin-phenotype-association:latest
  # ghcr.io/omnibioai/omnibioai-plugin-variant-annotation:latest

  auth-service:
    image: ghcr.io/omnibioai/omnibioai-auth:latest
    build:
      context: ${MACHINE_DIR}/omnibioai-auth
    ports:
      - "${HOST_IP:-0.0.0.0}:8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}

      SECRET_KEY: ${AUTH_SECRET_KEY:-change-me}

      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      REDIS_URL: redis://redis:6379

      CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,https://webstudio.omnibioai.org,https://app.omnibioai.org,https://lims.omnibioai.org,https://omnibioai.org}

      # Encrypts GlobalConfig's LLM/cloud credential fields at rest
      # (app/core/crypto.py). Deliberately empty by default, NOT a
      # placeholder value like AUTH_SECRET_KEY's :-change-me below --
      # empty means the config-write feature is simply unavailable until
      # set (service still starts fine); a real committed-to-the-repo
      # default here would mean every deployment shares the same
      # encryption key, defeating the point. Generate one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}

      # OAuth2 SSO — optional; empty values keep SSO disabled without blocking startup.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-https://webstudio.omnibioai.org}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://webstudio.omnibioai.org}
      LIMS_SSO_CLIENT_ID: ${LIMS_SSO_CLIENT_ID:-omnibioai-lims}
      LIMS_SSO_CLIENT_SECRET: ${LIMS_SSO_CLIENT_SECRET}
      LIMS_SSO_REDIRECT_URI: ${LIMS_SSO_REDIRECT_URI:-https://lims.omnibioai.org/sso/callback}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # PR-B4: drains interactions:events (published by auth-service's own
  # interaction_service.publish_interaction, and by rag's PR-B3 producer)
  # into auth-service's own `interactions` table via persist_interaction.
  # Same shape as security-audit-worker below (build:, not image: -- no
  # ghcr.io/omnibioai/omnibioai-auth-worker image is published by CI
  # today, identical gap to that service's own PR-B0 report) and reuses
  # auth-service's own DB_*/REDIS_URL values verbatim: it writes to the
  # same `omnibioai` database auth-service itself uses, not a separate one.
  interaction-worker:
    build:
      context: ${MACHINE_DIR}/omnibioai-auth
      dockerfile: Dockerfile.worker
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: omnibioai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      SECRET_KEY: ${AUTH_SECRET_KEY:-change-me}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  policy-engine:
    build:
      context: ${MACHINE_DIR}
      dockerfile: omnibioai-policy-engine/Dockerfile
    image: omnibioai-policy-engine-local
    ports:
      - "${HOST_IP:-0.0.0.0}:8002:8002"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  hpc-policy-engine:
    build:
      context: ${MACHINE_DIR}/omnibioai-hpc-policy-engine
      dockerfile: Dockerfile
    image: omnibioai-hpc-policy-engine-local
    ports:
      - "${HOST_IP:-0.0.0.0}:8003:8003"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      DB_NAME: ${MYSQL_DEFAULT_DB:-omnibioai}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  security-audit:
    image: ghcr.io/omnibioai/omnibioai-security-audit:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8004:8004"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      # Signing-secret provisioning fix: same var name/value already wired
      # into every other JWT_SECRET consumer in this file (see tes's own
      # entry above). Previously unset here, so this service's own JWT
      # verification (api/deps.py::require_platform_admin, audit/
      # identity.py::validate_identity_token) and, as of PR2's
      # AuditConfig.EVENT_SIGNING_SECRET, audit-event signature
      # verification both silently fell back to the public literal
      # "change-me" instead of the real platform secret.
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      # PR-B0: previously unset here, so GET /audit/events
      # (api/routes_audit_events.py, Depends(get_db)) fell back to
      # audit/config.py's default mysql+pymysql://root:root@localhost:3306/
      # omnibioai_audit -- unreachable from inside this container. The
      # write-side routes (/health, /audit/test) never hit this and so
      # never surfaced it.
      AUDIT_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-omnibioai}@mysql:3306/omnibioai_audit
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: on-failure

  # PR-B0: the Redis Streams consumer-group -> audit_events persistence
  # worker (worker/main.py, Dockerfile.worker) existed in the
  # omnibioai-security-audit repo but had no compose service of its own --
  # only the API container above was deployed. audit:events has been
  # accumulating real traffic from api-gateway/rag with nothing durably
  # persisting it. Built locally from source (build:, not image:), matching
  # the billing-worker precedent below rather than pulling a published
  # image -- no ghcr.io/omnibioai/omnibioai-security-audit-worker image is
  # published by CI today (.github/workflows/ci.yml's docker job only
  # builds the default Dockerfile, not Dockerfile.worker); see the PR-B0
  # report for that flagged follow-up.
  security-audit-worker:
    build:
      context: ${MACHINE_DIR}/omnibioai-security-audit
      dockerfile: Dockerfile.worker
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      # Signing-secret provisioning fix: same var name/value the API
      # service above (and every other JWT_SECRET consumer in this file)
      # already receives. Previously unset here, so AuditConfig.
      # EVENT_SIGNING_SECRET (PR2's classify_event_integrity()) silently
      # fell back to "change-me" instead of the real platform secret --
      # harmless while no producer signs, but would misclassify a real
      # producer's valid signature as "invalid" once one does.
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      AUDIT_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-omnibioai}@mysql:3306/omnibioai_audit
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/omnibioai/omnibioai-api-gateway:latest
    ports:
      - "${HOST_IP:-0.0.0.0}:8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      IAM_URL: http://auth-service:8001
      POLICY_URL: http://policy-engine:8002
      HPC_URL: http://hpc-policy-engine:8003
      AUDIT_URL: http://security-audit:8004
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
      TES_URL: http://tes:8081
      WORKBENCH_URL: http://workbench:8000
      TOOLSERVER_URL: http://toolserver:9090
      RAG_URL: http://rag:8096
      MODEL_REGISTRY_URL: http://model-registry:8095
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      policy-engine:
        condition: service_started
      hpc-policy-engine:
        condition: service_started
      security-audit:
        condition: service_started
      workbench:
        condition: service_started
      tes:
        condition: service_started
      toolserver:
        condition: service_started
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    # ports:          # removed — access only via nginx /_svc/prometheus
    #   - "9091:9090"
    extra_hosts:
      # node-exporter runs with network_mode: host (required to see host-level
      # metrics), so it's not reachable via a normal bridge-network service
      # name -- host-gateway resolves to the docker bridge's host IP instead.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.external-url=http://localhost/_svc/prometheus'
      - '--web.route-prefix=/'
    restart: unless-stopped

  # ── grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-omnibioai}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "dark"
      # Grafana only ever exists here to be embedded read-only, kiosk-mode,
      # inside webstudio's Metrics tile -- anonymous access is scoped to
      # Viewer (no edit/admin/datasource capability), matching exactly what
      # the iframe already shows any signed-in webstudio user. Without this,
      # Grafana demands its own login for the iframe; that login redirect
      # (see GF_SERVER_ROOT_URL/SERVE_FROM_SUB_PATH below for why it escaped
      # the /_svc/monitor prefix) was landing on webstudio's own SPA
      # catch-all instead, recursively booting a second copy of the app
      # inside the iframe.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # nginx-router.conf proxies Grafana at /_svc/monitor (prefix stripped
      # before reaching Grafana) -- without telling Grafana about that
      # prefix, it generates root-relative URLs (including the login
      # redirect above) as if it owned "/", which nginx has no route for
      # and silently swallows into webstudio's own catch-all. The %(...)s
      # macros resolve from the actual incoming request's Host/scheme
      # (nginx-router.conf already forwards both via its server-level
      # proxy_set_header Host/X-Forwarded-Proto), so this works whether
      # Grafana is reached via localhost, webstudio.omnibioai.org, or any
      # other domain the tunnel maps to it.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/_svc/monitor/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana's default response header is X-Frame-Options: deny -- the
      # browser refuses to render it in an <iframe> at all regardless of
      # auth/sub-path being correct. This is the one setting that actually
      # permits the Metrics tile's embed to render.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/log/grafana
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_AUTH_PROXY_ENABLED: "false"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "localhost"
      GF_SECURITY_CSRF_ADDITIONAL_HEADERS: "X-Requested-With"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      # Theme CSS — loaded last by our patched index.html
      - ./monitoring/grafana/custom.css:/usr/share/grafana/public/build/custom.css:ro
      # Patched index.html — re-injects custom.css after emotion runs  ← ADD THIS
      - ./monitoring/grafana/index.html:/usr/share/grafana/public/views/index.html:ro
      # Replace login background images with solid #0f1117 to kill the purple gradient
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p0.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p1.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p2.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p3.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p4.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p5.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/bg/p6.png:ro
      - ./monitoring/grafana/login-bg.png:/usr/share/grafana/public/img/background_tease.jpg:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  license-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.license
    ports:
      - "8099:8099"
    environment:
      LICENSE_SECRET: ${LICENSE_SECRET:-omnibioai-secret-change-in-production}
      # PR11: ADMIN_KEY removed -- /api/license/generate and
      # /api/license/list are now IAM-authorized (Bearer JWT +
      # manage_licenses permission via omnibioai-auth), replacing the
      # static shared-secret check.
      GHCR_PULL_TOKEN: ${GHCR_PULL_TOKEN:-}
      IAM_URL: http://auth-service:8001
      # Optional: this service's own client_credentials identity (PR9),
      # used only for the startup self-check in license_server.py --
      # never for authorizing the manage_licenses-gated actions above.
      # Populated after registering license-server as an OAuth client via
      # POST /orgs/{org_id}/oauth-clients against omnibioai-auth; left
      # empty by default so a fresh environment starts up cleanly without
      # it configured yet.
      STUDIO_SERVICE_CLIENT_ID: ${STUDIO_SERVICE_CLIENT_ID:-}
      STUDIO_SERVICE_CLIENT_SECRET: ${STUDIO_SERVICE_CLIENT_SECRET:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-omnibioai}
      MYSQL_DATABASE: omnibioai_licenses
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: omnibioai-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8585:8080"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: omnibioai-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: omnibioai-node-exporter
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      # disabled by default (reads /proc/*/status for every process) --
      # needed for node_processes_pids/threads (processes_total/threads_total)
      - '--collector.processes'
    restart: unless-stopped

  # OmniBioAI Studio web SPA — served as static files behind nginx-router
  # (see docker/nginx-router.conf's `web-ui` upstream / `location /`).
  # Same in-repo build-context pattern as workbench/control-center use for
  # their own Dockerfiles, just pointed at this repo instead of a sibling
  # ${MACHINE_DIR}/... checkout, since Dockerfile.web lives here.
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web
    # image: ghcr.io/omnibioai/omnibioai-web:latest
    restart: unless-stopped

  nginx-router:
    image: nginx:latest
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MACHINE_DIR}/omnibioai-docs:/docs:ro
      - ./docker/static:/etc/nginx/omni-static:ro
    depends_on:
      - workbench
      - web-ui
      - lims
      - rag
      - api-gateway
      - auth-service
      - control-center
      - billing-service
      - grafana
      - videos
      - launcher
      - model-registry
      - workflow-bundles
      - tool-images
      - dev-hub
      - tes
      - toolserver
      - opa
      - jupyter
      - rstudio
      - vscode
      - cadvisor
      - redis-exporter
    restart: unless-stopped

secrets:
  # BuildKit secret for the private omnibioai-iam-client git+https install
  # (tes, model-registry, lims, rag). Sourced from the same GHCR_PULL_TOKEN
  # already used for @man4ish npm auth -- requires repo/Contents:Read scope
  # on omnibioai-iam-client in addition to whatever scope it already has.
  # Never printed to build logs and never persisted in an image layer,
  # unlike a plain build.args ARG.
  github_token:
    environment: GHCR_PULL_TOKEN

volumes:
  mysql_data:
  redis_data:
  ollama_data:
  grafana_data:
  neo4j_data:
  neo4j_logs:
  # #265: docker-socket-proxy's exposed socket, shared with workbench.
  # Not a host bind mount -- the whole point is that only the proxy
  # container gets the real host docker.sock (mounted directly into
  # it above); everything else only ever sees this proxied one.
  docker-proxy-socket:
